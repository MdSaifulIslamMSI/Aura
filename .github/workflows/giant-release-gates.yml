name: Giant Release Gates

on:
  workflow_call:
    secrets:
      STAGING_AWS_DEPLOY_ROLE_ARN:
        required: false
    inputs:
      staging_off_acknowledged:
        description: 'Set true only when staging is intentionally kept stopped: the seven live staging-parity gates are skipped, and a proof job verifies staging really is off. Leave false to run the full gates.'
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24.x
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
  STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL || vars.STAGING_BASE_URL }}
  STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
  STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
  STAGING_HTTPS_MODE: ${{ vars.STAGING_HTTPS_MODE || 'direct' }}
  STAGING_API_HOST: ${{ vars.STAGING_API_HOST }}
  STAGING_ORIGIN_HOST: ${{ vars.STAGING_ORIGIN_HOST }}
  STAGING_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
  STAGING_SSM_PREFIX: /aura/staging
  SMOKE_TARGET_ENV: staging
  SMOKE_BASE_URL: ${{ vars.STAGING_BASE_URL }}
  SMOKE_REQUIRE_BACKEND_STAGING: "true"
  SMOKE_FORBID_PRODUCTION_ORIGINS: "true"
  PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
  PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
  PROD_HEALTH_URL: ${{ vars.PROD_HEALTH_URL || vars.PROD_API_BASE_URL }}
  PROD_SSM_PREFIX: /aura/prod
  AWS_DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
  ROLLBACK_ARTIFACT_URI: ${{ vars.ROLLBACK_ARTIFACT_URI }}
  ROLLBACK_TARGET_SHA: ${{ vars.ROLLBACK_TARGET_SHA }}

# OIDC trust boundary for the staging gates
#
# The jobs below that mint an OIDC token (permissions: id-token: write) must
# NOT declare an `environment:`. GitHub issues an environment-scoped `sub`
# claim ("repo:<owner>/<repo>:environment:<env>") for every run of a job that
# references the environment, whether the run was started by push,
# workflow_dispatch or pull_request, so an environment subject is identical for
# a reviewed main-branch run and for an unreviewed pull request and cannot
# anchor a trust policy. Without an environment the claim is ref-based: a
# pull_request run presents "ref:refs/pull/<n>/merge" and can never match the
# "ref:refs/heads/main" subject the staging operator role trusts
# (scripts/staging/00-create-iam-auth.sh).
#
# Every AWS-auth step is additionally guarded with
# "if: github.event_name != 'pull_request'" so a pull request never reaches
# sts:AssumeRoleWithWebIdentity. The guard alone is not a trust boundary (a
# pull request can edit this file), which is why the ref-based subject and the
# trust policy matter.
#
# Consequence for the operator: the staging values these gates read
# (vars.STAGING_BASE_URL, vars.STAGING_AWS_DEPLOY_ROLE_ARN, ...) must resolve
# from repository or organization level. The "staging" environment keeps holding
# the environment-scoped values for staging-smoke.yml, staging-frontend-smoke.yml
# and staging-aws-deploy.yml, but these jobs no longer read it.
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run test:server:regression:stable

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run security:maturity

  smoke-staging:
    name: smoke:staging
    if: inputs.staging_off_acknowledged != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AWS_DEPLOY_ROLE_ARN: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN || secrets.STAGING_AWS_DEPLOY_ROLE_ARN || '' }}
    steps:
      - name: Staging paused on PR - skip live checks
        if: github.event_name == 'pull_request'
        run: echo "::warning::staging is paused on PRs - live EC2/S3 checks skipped for smoke-staging" && exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - name: Assert staging AWS role is configured
        if: github.event_name != 'pull_request'
        run: test -n "${STAGING_AWS_DEPLOY_ROLE_ARN}" || { echo "Missing STAGING_AWS_DEPLOY_ROLE_ARN."; exit 1; }
      - name: Configure staging read role
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.STAGING_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-giant-release-staging-smoke
          mask-aws-account-id: true
          unset-current-credentials: true
      - run: npm run staging:state:refresh
        if: github.event_name != 'pull_request'
      - run: npm run smoke:staging
        if: github.event_name != 'pull_request'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: staging-smoke-evidence
          path: artifacts/release-gates/
          if-no-files-found: ignore
          retention-days: 14

  smoke-staging-frontend:
    name: smoke:staging:frontend
    if: inputs.staging_off_acknowledged != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AWS_DEPLOY_ROLE_ARN: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN || secrets.STAGING_AWS_DEPLOY_ROLE_ARN || '' }}
    steps:
      - name: Staging paused on PR - skip live checks
        if: github.event_name == 'pull_request'
        run: echo "::warning::staging is paused on PRs - live EC2/S3 checks skipped for smoke-staging-frontend" && exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - name: Assert staging AWS role is configured
        if: github.event_name != 'pull_request'
        run: test -n "${STAGING_AWS_DEPLOY_ROLE_ARN}" || { echo "Missing STAGING_AWS_DEPLOY_ROLE_ARN."; exit 1; }
      - name: Configure staging read role
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.STAGING_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-giant-release-frontend-smoke
          mask-aws-account-id: true
          unset-current-credentials: true
      - run: npm run staging:state:refresh
        if: github.event_name != 'pull_request'
      - run: npm run smoke:staging:frontend
        if: github.event_name != 'pull_request'

  smoke-env-contract:
    name: smoke:env-contract
    if: inputs.staging_off_acknowledged != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AWS_DEPLOY_ROLE_ARN: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN || secrets.STAGING_AWS_DEPLOY_ROLE_ARN || '' }}
    steps:
      - name: Staging paused on PR - skip live checks
        if: github.event_name == 'pull_request'
        run: echo "::warning::staging is paused on PRs - live EC2/S3 checks skipped for smoke-env-contract" && exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - name: Assert staging AWS role is configured
        if: github.event_name != 'pull_request'
        run: test -n "${STAGING_AWS_DEPLOY_ROLE_ARN}" || { echo "Missing STAGING_AWS_DEPLOY_ROLE_ARN."; exit 1; }
      - name: Configure staging read role
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.STAGING_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-giant-release-env-contract
          mask-aws-account-id: true
          unset-current-credentials: true
      - run: npm run staging:state:refresh
        if: github.event_name != 'pull_request'
      - run: npm run smoke:env-contract
        if: github.event_name != 'pull_request'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: env-contract-evidence
          path: artifacts/release-gates/
          if-no-files-found: ignore
          retention-days: 14

  aws-cost-guard:
    name: aws:cost-guard
    if: inputs.staging_off_acknowledged != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AWS_DEPLOY_ROLE_ARN: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN || secrets.STAGING_AWS_DEPLOY_ROLE_ARN || '' }}
    steps:
      - name: Staging paused on PR - skip live checks
        if: github.event_name == 'pull_request'
        run: echo "::warning::staging is paused on PRs - live EC2/S3 checks skipped for aws-cost-guard" && exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - name: Assert staging AWS role is configured
        if: github.event_name != 'pull_request'
        run: test -n "${STAGING_AWS_DEPLOY_ROLE_ARN}" || { echo "Missing STAGING_AWS_DEPLOY_ROLE_ARN."; exit 1; }
      - name: Configure staging read role
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.STAGING_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-giant-release-cost-guard
          mask-aws-account-id: true
          unset-current-credentials: true
      - run: npm run aws:cost-guard
        if: github.event_name != 'pull_request'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: cost-guard-evidence
          path: artifacts/release-gates/
          if-no-files-found: ignore
          retention-days: 14

  aws-observability-guard:
    name: aws:observability:guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same staging-parity skip contract as the other staging-scoped gates
    # (staging:off-proof self-proves staging is stopped on ack'd deploys).
    if: inputs.staging_off_acknowledged != true
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AWS_DEPLOY_ROLE_ARN: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN || secrets.STAGING_AWS_DEPLOY_ROLE_ARN || '' }}
    steps:
      - name: Staging paused on PR - skip live checks
        if: github.event_name == 'pull_request'
        run: echo "::warning::staging is paused on PRs - live EC2/S3 checks skipped for aws-observability-guard" && exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - name: Assert staging AWS role is configured
        if: github.event_name != 'pull_request'
        run: test -n "${STAGING_AWS_DEPLOY_ROLE_ARN}" || { echo "Missing STAGING_AWS_DEPLOY_ROLE_ARN."; exit 1; }
      - name: Configure staging read role
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.STAGING_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-giant-release-observability
          mask-aws-account-id: true
          unset-current-credentials: true
      - run: npm run aws:observability:guard
        if: github.event_name != 'pull_request'

  release-rollback-ready:
    name: release:rollback-ready
    if: inputs.staging_off_acknowledged != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AWS_DEPLOY_ROLE_ARN: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN || secrets.STAGING_AWS_DEPLOY_ROLE_ARN || '' }}
    steps:
      - name: Staging paused on PR - skip live checks
        if: github.event_name == 'pull_request'
        run: echo "::warning::staging is paused on PRs - live EC2/S3 checks skipped for release-rollback-ready" && exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - name: Assert staging AWS role is configured
        if: github.event_name != 'pull_request'
        run: test -n "${STAGING_AWS_DEPLOY_ROLE_ARN}" || { echo "Missing STAGING_AWS_DEPLOY_ROLE_ARN."; exit 1; }
      - name: Configure staging read role for optional S3 rollback proof
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.STAGING_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-giant-release-rollback-ready
          mask-aws-account-id: true
          unset-current-credentials: true
      - run: npm run release:rollback-ready
        if: github.event_name != 'pull_request'

  test-reliability:
    name: test:reliability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - name: Clear stale mongodb binary cache
        run: rm -rf ~/.cache/mongodb-binaries
      - run: npm run test:reliability

  sre-synthetic-staging:
    name: sre:synthetic:staging
    if: inputs.staging_off_acknowledged != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AWS_DEPLOY_ROLE_ARN: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN || secrets.STAGING_AWS_DEPLOY_ROLE_ARN || '' }}
      # GitHub-hosted runners are outside the staging region; the 250ms in-region health target remains documented.
      SRE_HEALTH_BUDGET_MS: "2500"
    steps:
      - name: Staging paused on PR - skip live checks
        if: github.event_name == 'pull_request'
        run: echo "::warning::staging is paused on PRs - live EC2/S3 checks skipped for sre-synthetic-staging" && exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - name: Assert staging AWS role is configured
        if: github.event_name != 'pull_request'
        run: test -n "${STAGING_AWS_DEPLOY_ROLE_ARN}" || { echo "Missing STAGING_AWS_DEPLOY_ROLE_ARN."; exit 1; }
      - name: Configure staging read role
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.STAGING_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-giant-release-sre-synthetic
          mask-aws-account-id: true
          unset-current-credentials: true
      - run: npm run staging:state:refresh
        if: github.event_name != 'pull_request'
      - run: npm run sre:synthetic:staging
        if: github.event_name != 'pull_request'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: sre-synthetic-evidence
          path: artifacts/sre/
          if-no-files-found: ignore
          retention-days: 14

  sre-latency-staging:
    name: sre:latency:staging
    if: inputs.staging_off_acknowledged != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AWS_DEPLOY_ROLE_ARN: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN || secrets.STAGING_AWS_DEPLOY_ROLE_ARN || '' }}
      # GitHub-hosted runners are outside the staging region; the 250ms in-region health target remains documented.
      SRE_LATENCY_HEALTH_BUDGET_MS: "2500"
    steps:
      - name: Staging paused on PR - skip live checks
        if: github.event_name == 'pull_request'
        run: echo "::warning::staging is paused on PRs - live EC2/S3 checks skipped for sre-latency-staging" && exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - name: Assert staging AWS role is configured
        if: github.event_name != 'pull_request'
        run: test -n "${STAGING_AWS_DEPLOY_ROLE_ARN}" || { echo "Missing STAGING_AWS_DEPLOY_ROLE_ARN."; exit 1; }
      - name: Configure staging read role
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.STAGING_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-giant-release-sre-latency
          mask-aws-account-id: true
          unset-current-credentials: true
      - run: npm run staging:state:refresh
        if: github.event_name != 'pull_request'
      - run: npm run sre:latency:staging
        if: github.event_name != 'pull_request'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: sre-latency-evidence
          path: artifacts/sre/
          if-no-files-found: ignore
          retention-days: 14

  staging-off-proof:
    name: staging:off-proof
    if: inputs.staging_off_acknowledged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_AWS_DEPLOY_ROLE_ARN: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN || secrets.STAGING_AWS_DEPLOY_ROLE_ARN || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Assert staging AWS role is configured
        if: github.event_name != 'pull_request'
        run: test -n "${STAGING_AWS_DEPLOY_ROLE_ARN}" || { echo "Missing STAGING_AWS_DEPLOY_ROLE_ARN."; exit 1; }
      - name: Configure staging read role
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.STAGING_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-giant-release-staging-off-proof
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Prove staging is actually stopped
        # Consumes the AWS credentials minted by the guarded step above, so it
        # must be skipped on pull requests for the same reason.
        if: github.event_name != 'pull_request'
        run: |
          refresh_log="$(npm run staging:state:refresh 2>&1)" && refresh_status=ok || refresh_status=fail
          printf '%s\n' "$refresh_log"
          if [ "$refresh_status" = "ok" ]; then
            echo "::error::staging_off_acknowledged was set, but staging state refreshed successfully - a running staging instance exists. Re-dispatch without the flag so the live gates run."
            exit 1
          fi
          printf '%s\n' "$refresh_log" | grep -q "no running EC2 instance has Environment=staging" || {
            echo "::error::staging state refresh failed for an unexpected reason; refusing to treat it as staging-off evidence."
            exit 1
          }
          echo "Verified: no running staging instance. Live staging-parity gates skipped by explicit staging_off_acknowledged=true."
