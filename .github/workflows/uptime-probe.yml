name: Uptime Probe

on:
  workflow_dispatch: {}
  schedule:
    # Every 30 minutes; the prober itself must stay cheap and regular
    - cron: "*/30 * * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AURA_UPTIME_BACKEND_URL: ${{ vars.AURA_UPTIME_BACKEND_URL || '' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe backend health endpoint
        run: |
          set -euo pipefail
          # Configured via repo variable AURA_UPTIME_BACKEND_URL (the backend
          # host identity is currently ephemeral, so it is not hardcoded here).
          # An unconfigured probe is itself a P0 reliability gap: fail loudly
          # so the scheduled-workflow failure email keeps flagging it until
          # the variable is set (see docs/backup-activation-checklist.md).
          if [ -z "${AURA_UPTIME_BACKEND_URL}" ]; then
            echo "::error::AURA_UPTIME_BACKEND_URL is not configured; production liveness is unmonitored. Set it via: gh variable set AURA_UPTIME_BACKEND_URL --body https://<prod-origin>"
            exit 1
          fi
          probe() {
            curl -fsS --max-time 15 --retry 2 --retry-delay 5 \
              --connect-timeout 10 \
              "${AURA_UPTIME_BACKEND_URL%/}/api/health/live" >/dev/null
          }
          if ! probe; then
            echo "::error::Backend health probe failed for ${AURA_UPTIME_BACKEND_URL}"
            exit 1
          fi
          echo "Backend healthy at ${AURA_UPTIME_BACKEND_URL}"
