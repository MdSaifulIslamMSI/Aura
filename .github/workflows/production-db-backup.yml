name: Production DB Backup

on:
  workflow_dispatch:
    inputs:
      run_drill:
        description: "Run the isolated restore drill after a successful backup"
        type: boolean
        default: false
  schedule:
    # 21:13 UTC daily (02:43 IST) - low-traffic window
    - cron: "13 21 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-db-backup
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_INSTANCE_TAG_KEY: ${{ vars.AWS_INSTANCE_TAG_KEY || 'Name' }}
  AWS_INSTANCE_TAG_VALUE: ${{ vars.AWS_INSTANCE_TAG_VALUE || '' }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN || '' }}
  AURA_BACKUP_BUCKET: ${{ vars.AURA_BACKUP_BUCKET || '' }}
  AURA_BACKUP_RETENTION_DAYS: ${{ vars.AURA_BACKUP_RETENTION_DAYS || '35' }}

jobs:
  backup:
    runs-on: ubuntu-latest
    # Full dump of the Atlas shared-tier cluster over WAN can take well over
    # an hour; every downstream step is bounded by the SSM command itself.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate backup request
        run: |
          set -euo pipefail
          test -n "${AWS_DEPLOY_ROLE_ARN}" || { echo "Missing secret AWS_DEPLOY_ROLE_ARN"; exit 1; }
          test -n "${AWS_INSTANCE_TAG_KEY}" || { echo "Missing variable AWS_INSTANCE_TAG_KEY"; exit 1; }
          test -n "${AWS_INSTANCE_TAG_VALUE}" || { echo "Missing variable AWS_INSTANCE_TAG_VALUE"; exit 1; }
          test -n "${AURA_BACKUP_BUCKET}" || { echo "Missing variable AURA_BACKUP_BUCKET (S3 bucket for production Mongo archives)"; exit 1; }
          case "${AURA_BACKUP_RETENTION_DAYS}" in
            ''|*[!0-9]*) echo "AURA_BACKUP_RETENTION_DAYS must be a positive integer"; exit 1 ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-production-db-backup
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Ensure backup bucket versioning and retention
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execSync } = require('child_process');
          const bucket = process.env.AURA_BACKUP_BUCKET;
          const retention = Number(process.env.AURA_BACKUP_RETENTION_DAYS || '35');

          let versioning = 'None';
          try {
            versioning = execSync(
              `aws s3api get-bucket-versioning --bucket "${bucket}" --query 'Status' --output text`,
              { encoding: 'utf8' },
            ).trim() || 'None';
          } catch (error) {
            versioning = 'None';
          }
          if (versioning !== 'Enabled') {
            execSync(`aws s3api put-bucket-versioning --bucket "${bucket}" --versioning-configuration Status=Enabled`);
            console.log('Bucket versioning enabled');
          }

          let rules = [];
          try {
            const raw = execSync(
              `aws s3api get-bucket-lifecycle-configuration --bucket "${bucket}" --output json`,
              { encoding: 'utf8' },
            );
            rules = JSON.parse(raw).Rules || [];
          } catch (error) {
            rules = [];
          }
          const ruleId = 'aura-prod-mongo-backup-retention';
          const nextRules = rules.filter((rule) => rule.ID !== ruleId);
          nextRules.push({
            ID: ruleId,
            Filter: { Prefix: 'production/mongo/' },
            Status: 'Enabled',
            Expiration: { Days: retention },
            NoncurrentVersionExpiration: { NoncurrentDays: retention },
          });
          execSync(
            `aws s3api put-bucket-lifecycle-configuration --bucket "${bucket}" --lifecycle-configuration '${JSON.stringify({ Rules: nextRules })}'`,
          );
          console.log(`Retention rule ensured: production/mongo/ expires after ${retention} days`);

          // Best-effort bucket hardening: object uploads are already SSE-S3
          // per object (--sse aws), so a denied hardening call is logged and
          // skipped rather than failing the run when the deploy role lacks
          // the IAM grant.
          const harden = (label, command) => {
            try {
              execSync(command, { stdio: 'pipe' });
              console.log(`Bucket hardening ok: ${label}`);
            } catch (error) {
              console.log(`Bucket hardening skipped (${label}): ${String(error.message).split('\n')[0]}`);
            }
          };
          harden('public access block', `aws s3api put-public-access-block --bucket "${bucket}" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true`);
          harden('default encryption', `aws s3api put-bucket-encryption --bucket "${bucket}" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'`);
          NODE

      - name: Resolve backend instance
        id: resolve_instance
        run: |
          set -euo pipefail
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:${AWS_INSTANCE_TAG_KEY},Values=${AWS_INSTANCE_TAG_VALUE}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)"
          test -n "${INSTANCE_ID}" && test "${INSTANCE_ID}" != "None" || { echo "No running EC2 instance matched ${AWS_INSTANCE_TAG_KEY}=${AWS_INSTANCE_TAG_VALUE}"; exit 1; }
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"

      - name: Dispatch backup through SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.resolve_instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          export RUNNER_SCRIPT_B64
          RUNNER_SCRIPT_B64="$(base64 -w 0 scripts/production/backup-production-mongo.sh)"

          node <<'NODE' > "${RUNNER_TEMP}/ssm-commands.json"
          const commands = [
            'set -euo pipefail',
            `printf '%s' '${process.env.RUNNER_SCRIPT_B64}' | base64 -d > /tmp/aura_prod_backup.sh`,
            'chmod 700 /tmp/aura_prod_backup.sh',
            `AURA_BACKUP_BUCKET="${process.env.AURA_BACKUP_BUCKET}" AWS_REGION="${process.env.AWS_REGION}" bash /tmp/aura_prod_backup.sh; status=$?; rm -f /tmp/aura_prod_backup.sh; exit $status`,
          ];
          console.log(JSON.stringify({ commands }, null, 2));
          NODE

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Aura production Mongo backup" \
            --timeout 5400 \
            --parameters "file://${RUNNER_TEMP}/ssm-commands.json" \
            --query "Command.CommandId" \
            --output text)"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for backup completion
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          INSTANCE_ID: ${{ steps.resolve_instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          # ~88 minutes of polling; the SSM command itself is bounded at 5400s
          # and the dump of the shared-tier cluster over WAN takes tens of
          # minutes, so this must outlast the SSM timeout.
          for _ in $(seq 1 530); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text)"
            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for production backup command."
          exit 1

      - name: Verify backup object in S3
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          INSTANCE_ID: ${{ steps.resolve_instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          STDOUT_JSON="$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text)"
          BACKUP_S3_KEY="$(printf '%s\n' "$STDOUT_JSON" | grep '^BACKUP_S3_KEY=' | head -1 | cut -d= -f2-)"
          test -n "${BACKUP_S3_KEY}" || { echo "Backup runner did not report BACKUP_S3_KEY"; exit 1; }
          aws s3api head-object \
            --bucket "${AURA_BACKUP_BUCKET}" \
            --key "${BACKUP_S3_KEY}" \
            --query '{Size:ContentLength,VersionId:VersionId,ETag:ETag}' \
            --output json
          echo "Verified s3://${AURA_BACKUP_BUCKET}/${BACKUP_S3_KEY}"

      - name: Notify Aura status system on failure
        if: failure()
        run: |
          set -euo pipefail
          if [ -z "$STATUS_WEBHOOK_URL" ] || [ -z "$STATUS_WEBHOOK_TOKEN" ]; then
            echo "Status webhook secrets are not configured; skipping status notification."
            exit 0
          fi

          curl -fsS -X POST "$STATUS_WEBHOOK_URL" \
            -H "Authorization: Bearer $STATUS_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "source": "github_actions",
              "workflow": "Production DB Backup",
              "conclusion": "failure",
              "sha": "${GITHUB_SHA}",
              "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            }' || echo "Status webhook notification failed; the job failure is still recorded."
        env:
          STATUS_WEBHOOK_URL: ${{ secrets.STATUS_WEBHOOK_URL }}
          STATUS_WEBHOOK_TOKEN: ${{ secrets.STATUS_WEBHOOK_TOKEN }}

  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate freshness check request
        run: |
          set -euo pipefail
          test -n "${AWS_DEPLOY_ROLE_ARN}" || { echo "Missing secret AWS_DEPLOY_ROLE_ARN"; exit 1; }
          test -n "${AURA_BACKUP_BUCKET}" || { echo "Missing variable AURA_BACKUP_BUCKET (S3 bucket for production Mongo archives)"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-production-db-backup-freshness
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Fail if the newest backup is older than 26h
        run: |
          set -euo pipefail
          NEWEST_ISO="$(aws s3api list-objects-v2 \
            --bucket "${AURA_BACKUP_BUCKET}" \
            --prefix "production/mongo/" \
            --query 'sort_by(Contents[?ends_with(Key, `/mongo.archive.gz`)], &LastModified)[-1].LastModified' \
            --output text 2>/dev/null || true)"
          if [ -z "${NEWEST_ISO}" ] || [ "${NEWEST_ISO}" = "None" ]; then
            echo "No production Mongo backup object found under production/mongo/ — backups are NOT running."
            exit 1
          fi
          AGE_HOURS="$(node -e "
            const ageMs = Date.now() - new Date(process.argv[1]).getTime();
            console.log((ageMs / 3600000).toFixed(2));
          " "${NEWEST_ISO}")"
          echo "Newest backup: ${NEWEST_ISO} (${AGE_HOURS}h old)"
          node -e "
            const age = Number(process.argv[1]);
            if (!(age < 26)) {
              console.error('Newest production Mongo backup is older than 26h.');
              process.exit(1);
            }
          " "${AGE_HOURS}"

  ssm-preflight:
    # Dispatch-only health probe of the SSM execution channel. The opaque
    # SSM failure "failed to run commands: exit status 1" hides whether the
    # agent, disk, or docker is the problem; this surfaces it directly.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-prod-ssm-preflight
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Resolve backend instance
        id: resolve_instance
        run: |
          set -euo pipefail
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:${AWS_INSTANCE_TAG_KEY},Values=${AWS_INSTANCE_TAG_VALUE}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)"
          test -n "${INSTANCE_ID}" && test "${INSTANCE_ID}" != "None" || { echo "No running EC2 instance matched ${AWS_INSTANCE_TAG_KEY}=${AWS_INSTANCE_TAG_VALUE}"; exit 1; }
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"

      - name: Probe SSM channel, disk, docker
        env:
          INSTANCE_ID: ${{ steps.resolve_instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Aura SSM preflight" \
            --timeout 120 \
            --parameters 'commands=["set -euo pipefail","echo SSM_CHANNEL_OK","uname -r","df -h / /opt /tmp","docker version --format \"docker server: {{.Server.Version}}\"","docker ps --format \"{{.Names}}\" | head -10","free -m | head -2"]' \
            --query "Command.CommandId" \
            --output text)"
          for _ in $(seq 1 24); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text)"
            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM preflight."
          exit 1

  restore-drill:
    # Dispatch-gated drill (run_drill=true): verifies the newest backup is
    # restorable in an isolated container on the prod host. Never touches
    # live data. Requires a successful backup in the same run.
    runs-on: ubuntu-latest
    needs: backup
    if: github.event_name == 'workflow_dispatch' && inputs.run_drill == true && needs.backup.result == 'success'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-prod-restore-drill
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Resolve backend instance
        id: resolve_instance
        run: |
          set -euo pipefail
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:${AWS_INSTANCE_TAG_KEY},Values=${AWS_INSTANCE_TAG_VALUE}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)"
          test -n "${INSTANCE_ID}" && test "${INSTANCE_ID}" != "None" || { echo "No running EC2 instance matched ${AWS_INSTANCE_TAG_KEY}=${AWS_INSTANCE_TAG_VALUE}"; exit 1; }
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"

      - name: Resolve newest backup object
        id: resolve_backup
        run: |
          set -euo pipefail
          RESTORE_S3_KEY="$(aws s3api list-objects-v2 \
            --bucket "${AURA_BACKUP_BUCKET}" \
            --prefix "production/mongo/" \
            --query 'sort_by(Contents[?ends_with(Key, `/mongo.archive.gz`)], &LastModified)[-1].Key' \
            --output text)"
          test -n "${RESTORE_S3_KEY}" && test "${RESTORE_S3_KEY}" != "None" || { echo "No backup object to drill against"; exit 1; }
          echo "restore_s3_key=${RESTORE_S3_KEY}" >> "$GITHUB_OUTPUT"

      - name: Dispatch restore drill through SSM
        env:
          INSTANCE_ID: ${{ steps.resolve_instance.outputs.instance_id }}
          RESTORE_S3_KEY: ${{ steps.resolve_backup.outputs.restore_s3_key }}
        run: |
          set -euo pipefail
          export RUNNER_SCRIPT_B64
          RUNNER_SCRIPT_B64="$(base64 -w 0 scripts/production/restore-production-mongo.sh)"

          node <<'NODE' > "${RUNNER_TEMP}/drill-commands.json"
          const commands = [
            'set -euo pipefail',
            `printf '%s' '${process.env.RUNNER_SCRIPT_B64}' | base64 -d > /tmp/aura_prod_restore_drill.sh`,
            'chmod 700 /tmp/aura_prod_restore_drill.sh',
            `RESTORE_DRILL=true AURA_BACKUP_BUCKET="${process.env.AURA_BACKUP_BUCKET}" AWS_REGION="${process.env.AWS_REGION}" RESTORE_S3_KEY="${process.env.RESTORE_S3_KEY}" bash /tmp/aura_prod_restore_drill.sh; status=$?; rm -f /tmp/aura_prod_restore_drill.sh; exit $status`,
          ];
          console.log(JSON.stringify({ commands }, null, 2));
          NODE

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Aura production restore drill" \
            --timeout 3000 \
            --parameters "file://${RUNNER_TEMP}/drill-commands.json" \
            --query "Command.CommandId" \
            --output text)"

          for _ in $(seq 1 180); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text)"
            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json | tee "${RUNNER_TEMP}/drill-result.json"
                grep -Fq 'RESTORE_DRILL_PASS' "${RUNNER_TEMP}/drill-result.json"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for restore drill."
          exit 1
