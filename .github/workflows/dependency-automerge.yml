name: Dependency Automerge Policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    # Monday sweep, after Dependabot's Monday 07:00 run — self-heals any PR
    # the event path missed (races, holds cancelled by earlier failures).
    - cron: '37 13 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Classify only — no labels, comments, or auto-merge'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: dep-automerge-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  policy:
    name: Dependency automerge policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Classify dependency PRs against policy
        env:
          # GitHub forbids GITHUB_TOKEN from arming auto-merge on Dependabot
          # PRs. If you add a fine-grained PAT as the DEPENDABOT_MERGE_TOKEN
          # secret, the controller arms merges directly from CI; otherwise the
          # scheduled local sweep (docs/dependency-automation.md) does it.
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN || github.token }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/github/dependency-automerge-policy.mjs --pr "$GH_PR_NUMBER"
          else
            node scripts/github/dependency-automerge-policy.mjs --sweep
          fi
