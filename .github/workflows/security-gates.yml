name: Security Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_sarif_upload:
        description: "Set true by caller workflows so SARIF uploads happen only from this workflow's own direct runs"
        type: boolean
        default: false
  # The push trigger exists so the SARIF uploads (see the upload step
  # conditions below) come from this workflow's own run. GitHub attributes a
  # tool's setup to the top-level workflow of the run that uploaded its SARIF,
  # and marks that setup red when the run fails — even if the upload itself
  # was clean. production-on-push.yml calls this workflow via workflow_call on
  # every main push and can fail for reasons unrelated to scanning (e.g. AWS
  # OIDC), so it passes skip_sarif_upload: true: the called run skips the
  # uploads while the scanners keep running, and the direct push run uploads.
  # The input is the only reliable discriminator — a called workflow sees the
  # caller's github.event_name (push, not workflow_call), and job.workflow_ref
  # is not a real context property.

permissions:
  contents: read

concurrency:
  group: security-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-contract:
    name: Environment Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate default environment contract
        run: npm run env:validate
      - name: Validate auth environment contract
        run: npm run auth:env:validate
      - name: Run auth smoke contract
        run: npm run auth:smoke
      - name: Run non-live smoke preflight
        run: npm run smoke:preflight
      - name: Scan for unsafe production fallbacks
        run: npm run scan:prod-fallbacks

  evidence:
    name: Evidence Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify security evidence map
        run: npm run security:evidence
      # The nuclei exception/expiry rules are unit-testable without Docker;
      # wire them into CI so baseline regressions fail the PR path instead of
      # surfacing only when a scan runs.
      - name: Run nuclei baseline unit tests
        run: npm run test:nuclei-baseline
      # The Scorecard Token-Permissions model is unit-testable without the
      # network; wire it into CI so a top-level write scope fails the PR path
      # instead of surfacing as a code-scanning alert a week later.
      - name: Run workflow token-permission unit tests
        run: npm run test:workflow-token-permissions
      # The CodeQL finding gate reads the report the CodeQL action produces, so
      # its policy is unit-testable too.
      - name: Run CodeQL SARIF gate unit tests
        run: npm run test:codeql-sarif

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run high and critical dependency audit
        run: npm run security:deps
      # The audit above includes devDependencies and only blocks at high. The
      # production dependency set was therefore never gated at the severity the
      # vulnerability-management policy actually sets an SLA for (Medium, 30
      # days). This step closes that gap: production-only, blocking at
      # moderate and above.
      - name: Block medium-or-worse production dependency vulnerabilities
        run: npm run security:audit:prod
      - name: Block deprecated packages
        run: npm run security:deprecated
      # Every security control is either enforced in production or staged with a
      # dated justification. This gate fails when a control is silently
      # unclassified, when a staged control's justification has expired, or when
      # the shipped production environment template contradicts the inventory.
      - name: Verify the security control inventory
        run: npm run security:controls
      # An exact-pinned override silently reverts a Dependabot security bump,
      # and the release-cooldown gate cannot see it: the cooldown only ages new
      # versions, it says nothing about a pin that refuses them. This gate
      # fails when a pinned override is holding an advisory-bearing version in
      # place while a fixed release exists.
      - name: Verify no pinned override reverts a security fix
        run: npm run security:override-pins

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block newly introduced high-risk dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Gitleaks
        run: npm run security:gitleaks
      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        if: always() && inputs.skip_sarif_upload != true && hashFiles('security-reports/gitleaks-report.sarif') != ''
        with:
          sarif_file: security-reports/gitleaks-report.sarif
          category: gitleaks
      - name: Upload secret scan report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: gitleaks-report
          path: |
            security-reports/gitleaks-report.json
            security-reports/gitleaks-report.sarif
          retention-days: 30

  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Semgrep
        run: npm run security:semgrep
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        if: always() && inputs.skip_sarif_upload != true && hashFiles('security-reports/semgrep-report.sarif') != ''
        with:
          sarif_file: security-reports/semgrep-report.sarif
          category: semgrep
      - name: Upload Semgrep report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: semgrep-report
          path: |
            security-reports/semgrep-report.json
            security-reports/semgrep-report.sarif
          retention-days: 30

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Trivy filesystem scan
        run: npm run security:trivy
      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        if: always() && inputs.skip_sarif_upload != true && hashFiles('security-reports/trivy-fs.sarif') != ''
        with:
          sarif_file: security-reports/trivy-fs.sarif
          category: trivy-filesystem
      - name: Upload Trivy filesystem reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: trivy-fs-reports
          path: |
            security-reports/trivy-fs.json
            security-reports/trivy-fs.sarif
            security-reports/trivy-fs-table.txt
          retention-days: 30

  iac-security:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      # The invisible-fabric checks below are node-based (security:authz runs
      # the server test suite via cross-env), so this job must install
      # dependencies like the other security jobs do.
      - name: Install dependencies
        run: npm ci
      - name: Install server dependencies
        run: npm --prefix server ci
      - name: Run Checkov, tfsec, and Terrascan
        run: npm run security:iac
      # Dockerfile hardening was previously only reachable via
      # security:toolchain, which no workflow referenced — Hadolint never ran
      # in CI. It is a docker tool, so it belongs with the IaC scanners.
      - name: Run Hadolint Dockerfile lint
        run: npm run security:hadolint
      # The invisible-fabric controls (invisible route exposure, frontend
      # secretless scan, authz coverage, internal exposure) were documented
      # controls with zero CI wiring. They are node-based, so they run here
      # without Docker and gate the PR path.
      - name: Run invisible fabric security checks
        run: npm run security:invisible-fabric
      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        if: always() && inputs.skip_sarif_upload != true && hashFiles('security-reports/checkov-report.sarif') != ''
        with:
          sarif_file: security-reports/checkov-report.sarif
          category: checkov
      - name: Upload IaC security reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: iac-security-reports
          path: |
            security-reports/checkov-report.json
            security-reports/checkov-report.sarif
            security-reports/tfsec-report.json
            security-reports/terrascan-report.json
          if-no-files-found: error
          retention-days: 30

  supply-chain-integrity:
    name: Supply Chain Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      # --ignore-scripts keeps the Electron binary from being downloaded: this
      # job only needs the JavaScript dependencies the gates import, and the
      # root install-script packages are gated separately below.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify action and scanner image pins
        run: npm run security:supply-chain-pins
      - name: Verify code scanning SARIF contract
        run: npm run security:sarif-contract
      - name: Verify lifecycle-script allowlist covers every install-script package
        run: npm run security:install-scripts
      - name: Verify lockfile resolutions are the official npm registry
        run: npm run security:lockfile-registry
      - name: Enforce release cooldown on changed lockfile versions
        run: npm run security:lockfile-freshness
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      - name: Enforce least-privilege GITHUB_TOKEN permissions
        run: npm run security:workflow-token-permissions

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No OIDC token here. This job runs on pull_request, and a token it can
    # mint must never be usable by a same-repository branch. The provenance
    # attestation lives in its own push-only job for that reason.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  sbom-provenance:
    name: SBOM Provenance
    # Attestation needs an OIDC token, so it is confined to a job that only
    # runs for a push. Keeping it out of the SBOM job means a pull-request
    # run of this workflow can never mint an identity token at all.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: sbom
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom
          path: .
      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: sbom.spdx.json

  zap-baseline:
    name: DAST - OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_URL: ${{ vars.STAGING_URL || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve ZAP target
        id: zap-target
        shell: bash
        env:
          SMOKE_TARGET_ENV: ${{ env.STAGING_URL != '' && 'staging' || 'local' }}
          SMOKE_BASE_URL: ${{ env.STAGING_URL != '' && env.STAGING_URL || 'http://127.0.0.1:4173' }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || '' }}
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || '' }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL || '' }}
          STAGING_SSM_PREFIX: ${{ vars.STAGING_SSM_PREFIX || '' }}
        run: |
          if [ -n "$STAGING_URL" ]; then
            npm run smoke:preflight
            echo "target=$STAGING_URL" >> "$GITHUB_OUTPUT"
            echo "mode=external-staging" >> "$GITHUB_OUTPUT"
          else
            echo "target=http://127.0.0.1:4173" >> "$GITHUB_OUTPUT"
            echo "mode=local-preview" >> "$GITHUB_OUTPUT"
          fi
      - name: Install frontend dependencies
        if: steps.zap-target.outputs.mode == 'local-preview'
        run: npm --prefix app ci
      - name: Build local frontend preview
        if: steps.zap-target.outputs.mode == 'local-preview'
        run: npm --prefix app run build
      - name: Start local frontend preview
        if: steps.zap-target.outputs.mode == 'local-preview'
        shell: bash
        run: |
          npm --prefix app run preview -- --host 0.0.0.0 --port 4173 > "$RUNNER_TEMP/aura-vite-preview.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/aura-vite-preview.pid"
          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:4173" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/aura-vite-preview.log"
          exit 1
      - name: Run ZAP baseline against staging
        run: npm run security:zap -- "${ZAP_TARGET}"
        env:
          ZAP_TARGET: ${{ steps.zap-target.outputs.target }}
          SMOKE_TARGET_ENV: ${{ env.STAGING_URL != '' && 'staging' || 'local' }}
          SMOKE_BASE_URL: ${{ env.STAGING_URL != '' && env.STAGING_URL || 'http://127.0.0.1:4173' }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || '' }}
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL || '' }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL || '' }}
          STAGING_SSM_PREFIX: ${{ vars.STAGING_SSM_PREFIX || '' }}
      - name: Upload ZAP reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: zap-baseline-report
          path: |
            security-reports/zap-baseline.html
            security-reports/zap-baseline.json
            security-reports/zap-baseline.md
          if-no-files-found: error
          retention-days: 30

  security-suite:
    name: Focused Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install server dependencies
        run: npm --prefix server ci
      - name: Run auth, authorization, upload, webhook, rate-limit, header, and logging tests
        run: |
          npm run security:auth
          npm run security:access-control
          npm run security:tokens
          npm run security:rate-limit
          npm run security:cors-csrf
          npm run security:admin
          npm run security:routes:coverage:strict
          npm run security:pqc:proof:strict
          npm run security:pqc:scorecard:strict
          npm run security:pqc:provider-register
          npm run security:pqc:real-target
          npm run traffic:fortress:test
          npm run security:traffic:matrix:strict
          npm run security:traffic:rate-limits:strict
          npm run security:traffic:proof:strict
          npm run security:maturity:strict
          npm run security:webhooks
          npm run security:headers
          npm run security:logging
          npm run security:malware-runtime
      - name: Upload PQC and traffic fortress reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pqc-traffic-fortress-reports
          path: |
            reports/security/pqc-real-target-proof.json
            reports/security/pqc-real-target-proof.md
            reports/security/traffic-resilience-matrix.json
            reports/security/traffic-resilience-matrix.md
            reports/security/rate-limit-coverage.json
            reports/security/rate-limit-coverage.md
            reports/security/traffic-resilience-proof.json
            reports/security/traffic-resilience-proof.md
            reports/security/security-maturity-scorecard.json
            reports/security/security-maturity-scorecard.md
          if-no-files-found: ignore
          retention-days: 14

  docker-image-security:
    name: Docker Image Security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Run Trivy image scan
        run: npm run security:trivy:image

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        if: always() && inputs.skip_sarif_upload != true && hashFiles('security-reports/trivy-image.sarif') != ''
        with:
          sarif_file: security-reports/trivy-image.sarif
          category: trivy-image

      - name: Upload image security reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: docker-image-security-reports
          path: security-reports/
          retention-days: 14
