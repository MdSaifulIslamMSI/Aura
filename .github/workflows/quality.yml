name: Quality Foundation

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24.x

jobs:
  quality-shard:
    name: Quality server tests shard (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # run-test-tier is dependency-free, so the shards skip the root install
      # entirely; jest itself comes from the cached backend node_modules.
      - name: Cache backend dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: server-nm
        with:
          path: server/node_modules
          key: nm-server-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - name: Install backend dependencies
        if: steps.server-nm.outputs.cache-hit != 'true'
        run: npm --prefix server ci

      # Same deterministic serialized execution as the release gates; the
      # shard split restores the wall-clock time that serialization cost.
      - name: Run sharded server suites and generate LCOV coverage
        run: node scripts/run-test-tier.cjs server regression --shard=${{ matrix.shard }}/3 --runInBand --forceExit --coverage

      - name: Upload server shard coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-coverage-shard-${{ matrix.shard }}
          path: server/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  quality-static:
    name: Quality lint, types, and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix app ci

      - name: Run blocking ESLint rules
        run: npm run quality:lint

      - name: Report TypeScript compiler readiness
        run: npm run quality:typecheck

      - name: Run frontend suites and generate LCOV coverage
        run: npm --prefix app run test:coverage

      - name: Build frontend bundle
        working-directory: app
        run: npx vite build

      - name: Check admin chunk isolation from the public shell
        run: npm run security:admin-chunk-isolation

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-coverage
          path: app/coverage/
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Quality, tests, and coverage
    needs:
      - quality-shard
      - quality-static
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download server shard coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: server-coverage-shard-*
          path: coverage-shards
          merge-multiple: false

      - name: Download frontend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: app-coverage
          path: app/coverage

      - name: Merge shard coverage into the canonical LCOV files
        run: |
          mkdir -p server/coverage
          npx --yes lcov-result-merger@6.0.0 "coverage-shards/server-coverage-shard-*/lcov.info" server/coverage/lcov.info
          wc -l server/coverage/lcov.info app/coverage/lcov.info

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-coverage
          path: |
            app/coverage/
            server/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Datadog CI Visibility
        if: always()
        continue-on-error: true
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          # Org site: US5. datadog-ci has no other way to target it.
          DD_SITE: us5.datadoghq.com
        run: |
          if [ -z "${DATADOG_API_KEY}" ]; then
            echo "DATADOG_API_KEY not configured; skipping Datadog upload."
            exit 0
          fi
          npx --yes @datadog/datadog-ci@5.17.0 coverage upload app/coverage/lcov.info server/coverage/lcov.info

  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUALITY_EXTERNAL_TOOLS_REQUIRED: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Record Knip dead-code baseline
        run: npm run quality:deadcode

      - name: Validate GitHub Actions workflows
        run: npm run quality:actions
      - name: Check CSP drift across the five policy copies
        run: npm run security:csp-drift
      - name: Check generated routing configs are in sync
        run: npm run vercel:routing:check

      - name: Validate shell scripts
        run: npm run quality:shell

      - name: Validate Dockerfiles
        run: npm run quality:dockerfile

      - name: Upload hygiene reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: repo-hygiene-reports
          path: |
            reports/quality/
            security-reports/hadolint.txt
          if-no-files-found: warn
          retention-days: 14

  osv-scanner:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FREE_SECURITY_SCANNERS_REQUIRED: "true"
      FREE_SECURITY_OSV_IMAGE: ghcr.io/google/osv-scanner:v2.3.6

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run OSV lockfile scan
        run: npm run quality:osv

      - name: Upload OSV reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: osv-scanner-report
          path: |
            security-reports/osv-scanner.stdout.txt
            security-reports/osv-scanner.stderr.txt
            security-reports/free-security-scanners.json
          if-no-files-found: error
          retention-days: 30

  sonar-quality-gate:
    name: Sonar quality gate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: quality-coverage
          path: .

      - name: Run Sonar-compatible analysis
        run: npm run quality:sonar
