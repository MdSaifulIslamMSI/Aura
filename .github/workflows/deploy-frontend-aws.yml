name: Deploy Frontend To AWS CloudFront

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to the AWS S3 production bucket
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      deploy:
        description: Publish to the AWS S3 production bucket
        required: false
        default: true
        type: boolean
      parent_holds_production_lock:
        description: Internal only; the reusable-workflow caller already owns the shared production mutation lock
        required: false
        default: false
        type: boolean
    secrets:
      AWS_FRONTEND_DEPLOY_ROLE_ARN:
        required: false
      VITE_FIREBASE_API_KEY:
        required: false
      VITE_TURNSTILE_SITE_KEY:
        required: false
      VITE_FIREBASE_APP_ID:
        required: false
      VITE_FIREBASE_AUTH_DOMAIN:
        required: false
      VITE_FIREBASE_CONFIG:
        required: false
      VITE_FIREBASE_MEASUREMENT_ID:
        required: false
      VITE_FIREBASE_MESSAGING_SENDER_ID:
        required: false
      VITE_FIREBASE_PROJECT_ID:
        required: false
      VITE_FIREBASE_STORAGE_BUCKET:
        required: false
      VITE_FIREBASE_WEB_CONFIG:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_PROJECT:
        required: false
      SENTRY_URL:
        required: false
      VITE_SENTRY_DSN:
        required: false
      VITE_DD_APPLICATION_ID:
        required: false
      VITE_DD_CLIENT_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.parent_holds_production_lock == true && format('aura-production-parent-{0}-frontend-aws', github.run_id) || 'aura-production-mutation' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24.x
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET || '' }}
  AWS_FRONTEND_DISTRIBUTION_ID: ${{ vars.AWS_FRONTEND_DISTRIBUTION_ID || '' }}
  AWS_FRONTEND_PUBLIC_URL: ${{ vars.AWS_FRONTEND_PUBLIC_URL || '' }}
  AWS_FRONTEND_DEPLOY_ROLE_ARN: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN || secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN || '' }}
  AURA_BACKEND_ORIGIN: ${{ vars.AURA_BACKEND_ORIGIN || vars.AWS_BACKEND_BASE_URL || '' }}
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY || '' }}
  VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY || '' }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN || '' }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID || '' }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET || '' }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '' }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID || '' }}
  VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID || '' }}
  VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG || secrets.VITE_FIREBASE_CONFIG || vars.VITE_FIREBASE_WEB_CONFIG || secrets.VITE_FIREBASE_WEB_CONFIG || '' }}
  VITE_FIREBASE_DISABLE_SOCIAL_AUTH: ${{ vars.VITE_FIREBASE_DISABLE_SOCIAL_AUTH || 'false' }}
  VITE_FIREBASE_ENABLE_MICROSOFT_AUTH: ${{ vars.VITE_FIREBASE_ENABLE_MICROSOFT_AUTH || 'false' }}
  VITE_FIREBASE_ENABLE_APPLE_AUTH: ${{ vars.VITE_FIREBASE_ENABLE_APPLE_AUTH || 'false' }}
  VITE_ADMIN_SECURITY_STATE_ENGINE_V2: ${{ vars.VITE_ADMIN_SECURITY_STATE_ENGINE_V2 || 'false' }}
  VITE_DUO_LOGIN_ENABLED: ${{ vars.VITE_DUO_LOGIN_ENABLED || 'false' }}

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      backend_origin: ${{ steps.backend.outputs.origin }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Resolve hosted backend origin
        id: backend
        run: |
          set -euo pipefail
          ORIGIN="$(node ./app/scripts/print_hosted_backend_origin.mjs)"
          echo "origin=${ORIGIN}" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Capture AWS release timestamp
        id: release
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build AWS frontend artifact
        working-directory: app
        env:
          VITE_DEPLOY_TARGET: multi-host
          VITE_API_URL: ${{ steps.backend.outputs.origin }}/api
          VITE_RELEASE_ID: ${{ github.sha }}
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_RELEASE_CHANNEL: ${{ inputs.deploy == true && 'production' || 'preview' }}
          VITE_RELEASE_SOURCE: github-actions
          VITE_RELEASE_TIME: ${{ steps.release.outputs.built_at }}
          # Empty-safe: build is identical to today when no DSN is configured.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || '' }}
          # Empty-safe: RUM stays disabled until both IDs are configured.
          VITE_DD_APPLICATION_ID: ${{ secrets.VITE_DD_APPLICATION_ID || '' }}
          VITE_DD_CLIENT_TOKEN: ${{ secrets.VITE_DD_CLIENT_TOKEN || '' }}
          # Org site: US5 (matches the RUM application).
          VITE_DD_SITE: us5.datadoghq.com
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          # This build publishes sourcemaps to Sentry before deploy, so emit
          # them here; the postbuild keeps the .map files for the upload and
          # every other build strips them. Non-VITE_ name on purpose: Vite
          # inlines VITE_* vars into the bundle, which would change its bytes.
          AURA_KEEP_SOURCEMAPS: 'true'
        run: npm run build

      - name: Publish Sentry release and sourcemaps
        # No `if:` on secrets here: reusable workflows forbid the secrets
        # context in conditions, so the guard lives in the shell instead.
        # Skipped cleanly until Sentry secrets exist; never blocks deploys.
        #
        # `continue-on-error` is what makes "never blocks deploys" true once the
        # secrets DO exist. Sentry's release API rate-limits (HTTP 429) and the
        # upload is an optional telemetry artifact, not a release gate - a
        # third-party throttle must not fail the production storefront deploy.
        # The step still reports as failed in the run so it stays visible, and
        # the sourcemap prune below stays hard-failing, so no unminified source
        # can ever reach the public origin.
        continue-on-error: true
        env:
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # Regional SaaS host; not a secret.
          SENTRY_URL: ${{ secrets.SENTRY_URL || 'https://xyz-yra.sentry.io' }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "Sentry secrets absent; skipping release upload."
            exit 0
          fi
          # npx -p puts sentry-cli on PATH for the release script without a new dependency.
          npx --yes -p @sentry/cli@3.4.2 node scripts/student-pack-sentry-release.mjs

      - name: Strip sourcemaps from the deploy payload
        # Run at the repo root so app/dist resolves regardless of the job's
        # working-directory default.
        working-directory: .
        # The build emits maps only for the Sentry upload above; the release
        # script uploads them but never deletes them, and it exits early when
        # Sentry secrets are absent. Strip them here so the S3 sync and the
        # artifact never carry a .map — unminified source is otherwise
        # publicly downloadable from the CloudFront origin.
        run: |
          set -euo pipefail
          find app/dist -name '*.map' -type f -print -delete
          if find app/dist -name '*.map' -print -quit | grep -q .; then
            echo "sourcemaps still present after prune" >&2
            exit 1
          fi
          echo "Deploy payload contains 0 sourcemaps."

      - name: Upload AWS frontend dist bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aws-frontend-dist
          path: app/dist
          retention-days: 7

  deploy-production:
    needs: build-frontend
    # This job declares `environment: aws-frontend-production`, so GitHub issues
    # an ENVIRONMENT-scoped OIDC subject for it - the same value a pull-request
    # run would receive. The live `aura-github-actions-frontend-deploy` role
    # trusts that subject, so the event is excluded by name rather than relying
    # on the inputs context alone.
    if: inputs.deploy == true && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    environment:
      name: aws-frontend-production
      url: ${{ steps.publish.outputs.site_url }}
    outputs:
      site_url: ${{ steps.publish.outputs.site_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate AWS frontend deployment configuration
        run: |
          set -euo pipefail
          test -n "${AWS_REGION}" || { echo "Missing AWS_REGION"; exit 1; }
          test -n "${AWS_FRONTEND_BUCKET}" || { echo "Missing AWS_FRONTEND_BUCKET"; exit 1; }
          test -n "${AWS_FRONTEND_DISTRIBUTION_ID}" || { echo "Missing AWS_FRONTEND_DISTRIBUTION_ID"; exit 1; }
          test -n "${AWS_FRONTEND_PUBLIC_URL}" || { echo "Missing AWS_FRONTEND_PUBLIC_URL"; exit 1; }
          test -n "${AWS_FRONTEND_DEPLOY_ROLE_ARN}" || { echo "Missing AWS_FRONTEND_DEPLOY_ROLE_ARN"; exit 1; }
          echo "Bucket: ${AWS_FRONTEND_BUCKET}"
          echo "Region: ${AWS_REGION}"
          echo "Distribution: ${AWS_FRONTEND_DISTRIBUTION_ID}"
          echo "Public URL: ${AWS_FRONTEND_PUBLIC_URL}"

      - name: Download built frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aws-frontend-dist
          path: app/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          role-session-name: aura-github-frontend-s3
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify AWS frontend origin and distribution access
        run: |
          set -euo pipefail
          aws s3api head-bucket \
            --bucket "${AWS_FRONTEND_BUCKET}" \
            --region "${AWS_REGION}"
          aws cloudfront get-distribution \
            --id "${AWS_FRONTEND_DISTRIBUTION_ID}" \
            > /dev/null

      - name: Snapshot current AWS frontend for rollback
        run: |
          set -euo pipefail
          BACKUP_PREFIX="_aura-rollback/${GITHUB_SHA}"

          aws s3 sync "s3://${AWS_FRONTEND_BUCKET}" "s3://${AWS_FRONTEND_BUCKET}/${BACKUP_PREFIX}" \
            --region "${AWS_REGION}" \
            --exclude "_aura-rollback/*"

          cat > "${RUNNER_TEMP}/aura-rollback-manifest.json" <<EOF
          {
            "backupPrefix": "${BACKUP_PREFIX}",
            "createdFromSha": "${GITHUB_SHA}",
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow": "${GITHUB_WORKFLOW}",
            "runId": "${GITHUB_RUN_ID}"
          }
          EOF

          aws s3 cp "${RUNNER_TEMP}/aura-rollback-manifest.json" "s3://${AWS_FRONTEND_BUCKET}/${BACKUP_PREFIX}/.aura-rollback-manifest.json" \
            --region "${AWS_REGION}" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/json"

      - name: Publish frontend to S3 origin bucket
        id: publish
        run: |
          set -euo pipefail
          aws s3 sync app/dist "s3://${AWS_FRONTEND_BUCKET}" \
            --region "${AWS_REGION}" \
            --delete \
            --exclude "_aura-rollback/*" \
            --cache-control "public,max-age=300"

          if [ -d app/dist/assets ]; then
            aws s3 sync app/dist/assets "s3://${AWS_FRONTEND_BUCKET}/assets" \
              --region "${AWS_REGION}" \
              --delete \
              --cache-control "public,max-age=31536000,immutable"
          fi

          aws s3 cp app/dist/index.html "s3://${AWS_FRONTEND_BUCKET}/index.html" \
            --region "${AWS_REGION}" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "${AWS_FRONTEND_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)"

          SITE_URL="${AWS_FRONTEND_PUBLIC_URL}"
          echo "site_url=${SITE_URL}" >> "$GITHUB_OUTPUT"
          echo "invalidation_id=${INVALIDATION_ID}" >> "$GITHUB_OUTPUT"

      - name: Verify CloudFront serves the app shell
        env:
          INVALIDATION_ID: ${{ steps.publish.outputs.invalidation_id }}
          SITE_URL: ${{ steps.publish.outputs.site_url }}
        run: |
          set -euo pipefail
          if ! aws cloudfront wait invalidation-completed \
            --distribution-id "${AWS_FRONTEND_DISTRIBUTION_ID}" \
            --id "${INVALIDATION_ID}"; then
            echo "CloudFront invalidation wait was unavailable; continuing with HTTP readiness polling." >&2
          fi

          READINESS_ATTEMPTS=30
          for attempt in $(seq 1 "${READINESS_ATTEMPTS}"); do
            if curl --fail --show-error --silent --location --max-time 10 "${SITE_URL}" > /dev/null; then
              exit 0
            fi
            echo "CloudFront app shell was not ready (attempt ${attempt}/${READINESS_ATTEMPTS})." >&2
            if [ "${attempt}" -lt "${READINESS_ATTEMPTS}" ]; then
              sleep 15
            fi
          done

          echo "CloudFront did not serve the app shell after invalidation and readiness polling." >&2
          exit 1

      - name: Add AWS frontend deploy to job summary
        env:
          SITE_URL: ${{ steps.publish.outputs.site_url }}
          BACKEND_ORIGIN: ${{ needs.build-frontend.outputs.backend_origin }}
        run: |
          {
            echo "### AWS CloudFront Frontend"
            echo
            echo "- Bucket: ${AWS_FRONTEND_BUCKET}"
            echo "- Distribution: ${AWS_FRONTEND_DISTRIBUTION_ID}"
            echo "- Site URL: ${SITE_URL}"
            echo "- Backend origin: ${BACKEND_ORIGIN}"
          } >> "$GITHUB_STEP_SUMMARY"
