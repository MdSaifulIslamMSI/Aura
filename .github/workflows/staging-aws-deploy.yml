name: staging-aws-deploy

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy to isolated AWS staging
        required: false
        default: main
      deploy_enabled:
        description: Type true to allow staging deployment
        required: true
        default: "false"
      qualification_enabled:
        description: Type true to run the destructive-safe Account Center staging qualification
        required: true
        default: "false"
      rollback_sha:
        description: Full known-good SHA used only as immutable rollback evidence
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'aura' }}
      STAGING_NAME: ${{ vars.STAGING_NAME || 'staging' }}
      STAGING_SSM_PREFIX: ${{ vars.STAGING_SSM_PREFIX }}
      STAGING_BUCKET_NAME: ${{ vars.STAGING_BUCKET_NAME }}
      STAGING_KEY_NAME: ${{ vars.STAGING_KEY_NAME }}
      STAGING_INSTANCE_TYPE: ${{ vars.STAGING_INSTANCE_TYPE || 't3.micro' }}
      STAGING_ROOT_VOLUME_GB: ${{ vars.STAGING_ROOT_VOLUME_GB || '20' }}
      STAGING_SWAP_GB: ${{ vars.STAGING_SWAP_GB || '2' }}
      STAGING_BUDGET_EMAIL: ${{ vars.STAGING_BUDGET_EMAIL }}
      STAGING_MONTHLY_BUDGET_USD: ${{ vars.STAGING_MONTHLY_BUDGET_USD || '30' }}
      STAGING_BACKEND_PORT: ${{ vars.STAGING_BACKEND_PORT || '3000' }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL || vars.STAGING_BASE_URL }}
      STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
      STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
      STAGING_API_HOST: ${{ vars.STAGING_API_HOST }}
      STAGING_HTTPS_MODE: ${{ vars.STAGING_HTTPS_MODE || 'direct' }}
      STAGING_ORIGIN_HOST: ${{ vars.STAGING_ORIGIN_HOST }}
      STAGING_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
      STAGING_ADMIN_SECURITY_PHASE: ${{ vars.STAGING_ADMIN_SECURITY_PHASE || 'legacy' }}
      STAGING_ADMIN_DUO_PROVIDER: ${{ vars.STAGING_ADMIN_DUO_PROVIDER }}
      STAGING_ADMIN_RECOVERY_TWO_PERSON_REQUIRED: ${{ vars.STAGING_ADMIN_RECOVERY_TWO_PERSON_REQUIRED }}
      STAGING_FIREBASE_PROJECT_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID }}
      STAGING_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
      STAGING_FIREBASE_WEB_CONFIG: ${{ secrets.STAGING_FIREBASE_WEB_CONFIG }}
      STAGING_EMAIL_PROVIDER: ${{ vars.STAGING_EMAIL_PROVIDER || 'null' }}
      STAGING_GMAIL_USER: ${{ secrets.STAGING_GMAIL_USER }}
      STAGING_GMAIL_APP_PASSWORD: ${{ secrets.STAGING_GMAIL_APP_PASSWORD }}
      STAGING_RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
      STAGING_EMAIL_FROM_ADDRESS: ${{ secrets.STAGING_EMAIL_FROM_ADDRESS }}
      PROD_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      STAGING_ADMIN_ALLOWLIST_EMAILS: ${{ secrets.STAGING_ADMIN_ALLOWLIST_EMAILS }}
      STAGING_DEPLOY_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED || 'false' }}
      STAGING_AWS_DEPLOY_ROLE_ARN: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN || secrets.STAGING_AWS_DEPLOY_ROLE_ARN }}
      PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
      PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
      PROD_SSM_PREFIX: ${{ vars.PROD_SSM_PREFIX }}
      GH_REPO: ${{ github.repository }}
      VERCEL_PROJECT_DIR: .
      ENABLE_EIP: "false"
      ENABLE_ROUTE53: "false"
      ENABLE_STAGING_HTTPS: ${{ vars.ENABLE_STAGING_HTTPS || 'false' }}
      SMOKE_TARGET_ENV: staging
      SMOKE_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      SMOKE_REQUIRE_BACKEND_STAGING: "true"
      SMOKE_FORBID_PRODUCTION_ORIGINS: "true"
      SMOKE_REQUIRE_SCANNER_READY: "true"
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_ACCOUNT_SMOKE_EMAIL: ${{ secrets.STAGING_ACCOUNT_SMOKE_EMAIL }}
      STAGING_ACCOUNT_SMOKE_PASSWORD: ${{ secrets.STAGING_ACCOUNT_SMOKE_PASSWORD }}
      STAGING_ACCOUNT_SMOKE_PHONE: ${{ secrets.STAGING_ACCOUNT_SMOKE_PHONE }}
      STAGING_ACCOUNT_OTHER_SMOKE_EMAIL: ${{ secrets.STAGING_ACCOUNT_OTHER_SMOKE_EMAIL }}
      STAGING_ACCOUNT_OTHER_SMOKE_PASSWORD: ${{ secrets.STAGING_ACCOUNT_OTHER_SMOKE_PASSWORD }}
      STAGING_ACCOUNT_OTHER_SMOKE_PHONE: ${{ secrets.STAGING_ACCOUNT_OTHER_SMOKE_PHONE }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.git_ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix app ci

      - name: Fail closed unless staging deploy is explicitly enabled
        env:
          DEPLOY_ENABLED_INPUT: ${{ inputs.deploy_enabled }}
        run: |
          set -euo pipefail
          test "${DEPLOY_ENABLED_INPUT}" = "true" || { echo "deploy_enabled input must be true."; exit 1; }
          test "${STAGING_DEPLOY_ENABLED}" = "true" || { echo "Set staging environment variable STAGING_DEPLOY_ENABLED=true to deploy."; exit 1; }
          test "${STAGING_SSM_PREFIX}" = "/aura/staging" || { echo "STAGING_SSM_PREFIX must be /aura/staging."; exit 1; }
          test "${PROD_SSM_PREFIX}" = "/aura/prod" || { echo "PROD_SSM_PREFIX must be /aura/prod."; exit 1; }
          test -n "${STAGING_AWS_DEPLOY_ROLE_ARN}" || { echo "Missing STAGING_AWS_DEPLOY_ROLE_ARN."; exit 1; }
          test -n "${STAGING_SSH_PRIVATE_KEY}" || { echo "Missing STAGING_SSH_PRIVATE_KEY."; exit 1; }

      - name: Validate staging qualification contract without mutation
        env:
          STAGING_PREFLIGHT_DRY_RUN: "true"
        run: npm run staging:preflight

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.STAGING_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: aura-staging-github-deploy
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Ensure non-rotating Account Center staging secrets
        run: node scripts/run-bash.mjs scripts/staging/03c-ensure-account-center-ssm-params.sh

      - name: Resolve isolated staging EC2
        run: |
          set -euo pipefail
          mkdir -p .staging
          INSTANCE_JSON="$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --filters \
              "Name=tag:Project,Values=${PROJECT_NAME}" \
              "Name=tag:Environment,Values=staging" \
              "Name=tag:ManagedBy,Values=codex-staging-bootstrap" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[0] | [0]' \
            --output json)"
          test "${INSTANCE_JSON}" != "null" || { echo "No running staging EC2 instance found."; exit 1; }
          export INSTANCE_JSON
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const instance = JSON.parse(process.env.INSTANCE_JSON);
          const state = {
            instance_id: instance.InstanceId,
            public_dns: instance.PublicDnsName,
            public_ip: instance.PublicIpAddress,
            staging_base_url: process.env.STAGING_BASE_URL,
            staging_frontend_url: process.env.STAGING_FRONTEND_URL || process.env.STAGING_BASE_URL,
            staging_api_base_url: process.env.STAGING_API_BASE_URL,
            staging_health_url: process.env.STAGING_HEALTH_URL,
            bucket: process.env.STAGING_BUCKET_NAME
          };
          fs.writeFileSync('.staging/state.json', `${JSON.stringify(state, null, 2)}\n`);
          NODE

      - name: Lease runner SSH access
        id: lease-runner-ssh
        run: |
          set -euo pipefail
          INSTANCE_ID="$(node --input-type=module -e "import fs from 'node:fs'; const state = JSON.parse(fs.readFileSync('.staging/state.json', 'utf8')); process.stdout.write(String(state.instance_id || '')); ")"
          test -n "${INSTANCE_ID}" || { echo "Staging instance ID is missing."; exit 1; }

          SECURITY_GROUP_ID="$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].SecurityGroups[0].GroupId' \
            --output text)"
          test -n "${SECURITY_GROUP_ID}" && test "${SECURITY_GROUP_ID}" != "None" || {
            echo "Staging security group could not be resolved."
            exit 1
          }

          SG_ENVIRONMENT="$(aws ec2 describe-security-groups \
            --region "${AWS_REGION}" \
            --group-ids "${SECURITY_GROUP_ID}" \
            --query 'SecurityGroups[0].Tags[?Key==`Environment`].Value | [0]' \
            --output text)"
          SG_PROJECT="$(aws ec2 describe-security-groups \
            --region "${AWS_REGION}" \
            --group-ids "${SECURITY_GROUP_ID}" \
            --query 'SecurityGroups[0].Tags[?Key==`Project`].Value | [0]' \
            --output text)"
          SG_MANAGED_BY="$(aws ec2 describe-security-groups \
            --region "${AWS_REGION}" \
            --group-ids "${SECURITY_GROUP_ID}" \
            --query 'SecurityGroups[0].Tags[?Key==`ManagedBy`].Value | [0]' \
            --output text)"
          test "${SG_ENVIRONMENT}" = "staging" || { echo "Refusing SSH access outside the staging security group."; exit 1; }
          test "${SG_PROJECT}" = "${PROJECT_NAME}" || { echo "Staging security group project tag mismatch."; exit 1; }
          test "${SG_MANAGED_BY}" = "codex-staging-bootstrap" || { echo "Staging security group ownership tag mismatch."; exit 1; }

          RUNNER_IP="$(curl --fail --silent --show-error --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')"
          RUNNER_IP="${RUNNER_IP}" node --input-type=module <<'NODE'
          import net from 'node:net';
          if (!net.isIPv4(process.env.RUNNER_IP || '')) {
            throw new Error('GitHub runner did not resolve to one IPv4 address.');
          }
          NODE
          RUNNER_CIDR="${RUNNER_IP}/32"

          SECURITY_GROUP_RULE_ID="$(aws ec2 authorize-security-group-ingress \
            --region "${AWS_REGION}" \
            --group-id "${SECURITY_GROUP_ID}" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_CIDR}" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)"
          if [ -z "${SECURITY_GROUP_RULE_ID}" ] || [ "${SECURITY_GROUP_RULE_ID}" = "None" ]; then
            aws ec2 revoke-security-group-ingress \
              --region "${AWS_REGION}" \
              --group-id "${SECURITY_GROUP_ID}" \
              --protocol tcp \
              --port 22 \
              --cidr "${RUNNER_CIDR}" >/dev/null || true
            echo "Temporary SSH rule was created without a rule ID and was revoked."
            exit 1
          fi

          {
            echo "security_group_id=${SECURITY_GROUP_ID}"
            echo "security_group_rule_id=${SECURITY_GROUP_RULE_ID}"
            echo "runner_cidr=${RUNNER_CIDR}"
          } >> "${GITHUB_OUTPUT}"
          echo "Leased temporary /32 SSH access for this workflow run."

      - name: Render SSH config
        run: |
          set -euo pipefail
          printf '%s\n' "${STAGING_SSH_PRIVATE_KEY}" > .staging/staging-key.pem
          chmod 600 .staging/staging-key.pem
          node scripts/smoke/assert-staging-contract.mjs
          STAGING_KEY_PATH="$PWD/.staging/staging-key.pem" node scripts/run-bash.mjs scripts/staging/06-render-ssh-config.sh

      - name: Deploy and verify isolated staging
        env:
          STAGING_ALLOWED_SSH_CIDR: ${{ steps.lease-runner-ssh.outputs.runner_cidr }}
        run: STAGING_KEY_PATH="$PWD/.staging/staging-key.pem" npm run staging:deploy

      - name: Validate Account Center qualification inputs
        if: ${{ inputs.qualification_enabled == 'true' }}
        env:
          QUALIFICATION_ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          set -euo pipefail
          [[ "${QUALIFICATION_ROLLBACK_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "qualification rollback_sha must be a full lowercase commit SHA."
            exit 1
          }
          git fetch --no-tags --depth=1 origin "${QUALIFICATION_ROLLBACK_SHA}"
          git cat-file -e "${QUALIFICATION_ROLLBACK_SHA}^{commit}"
          test "${QUALIFICATION_ROLLBACK_SHA}" != "$(git rev-parse HEAD)" || {
            echo "qualification rollback_sha must identify a previous known-good commit."
            exit 1
          }

      - name: Prepare redacted Account Center qualification credentials
        if: ${{ inputs.qualification_enabled == 'true' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };
          let firebaseConfig;
          try {
            firebaseConfig = JSON.parse(process.env.STAGING_FIREBASE_WEB_CONFIG || '');
          } catch {
            fail('STAGING_FIREBASE_WEB_CONFIG must be valid JSON.');
          }
          const values = {
            SMOKE_USER_EMAIL: process.env.STAGING_ACCOUNT_SMOKE_EMAIL,
            SMOKE_USER_PASSWORD: process.env.STAGING_ACCOUNT_SMOKE_PASSWORD,
            SMOKE_USER_NAME: 'AccountQualificationCustomer',
            SMOKE_USER_PHONE: process.env.STAGING_ACCOUNT_SMOKE_PHONE,
            SMOKE_OTHER_USER_EMAIL: process.env.STAGING_ACCOUNT_OTHER_SMOKE_EMAIL,
            SMOKE_OTHER_USER_PASSWORD: process.env.STAGING_ACCOUNT_OTHER_SMOKE_PASSWORD,
            SMOKE_OTHER_USER_NAME: 'AccountQualificationSecondary',
            SMOKE_OTHER_USER_PHONE: process.env.STAGING_ACCOUNT_OTHER_SMOKE_PHONE,
            SMOKE_FIREBASE_API_KEY: String(firebaseConfig?.apiKey || '').trim(),
            SMOKE_BASE_URL: process.env.STAGING_BASE_URL,
            PERF_BASE_URL: process.env.STAGING_BASE_URL,
            SMOKE_TARGET_ENV: 'staging',
            SMOKE_STAGING_ISOLATED: 'true',
            STAGING_SSM_PREFIX: '/aura/staging',
            PROD_BASE_URL: process.env.PROD_BASE_URL || '',
            PROD_API_BASE_URL: process.env.PROD_API_BASE_URL || '',
          };
          const emailPattern = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
          const passwordPattern = /^[A-Za-z0-9_-]{20,128}$/;
          const phonePattern = /^\+[1-9][0-9]{9,14}$/;
          if (!emailPattern.test(values.SMOKE_USER_EMAIL || '') || !emailPattern.test(values.SMOKE_OTHER_USER_EMAIL || '')) {
            fail('Dedicated staging smoke emails are missing or unsafe.');
          }
          if (!passwordPattern.test(values.SMOKE_USER_PASSWORD || '') || !passwordPattern.test(values.SMOKE_OTHER_USER_PASSWORD || '')) {
            fail('Dedicated staging smoke passwords are missing or unsafe.');
          }
          if (!phonePattern.test(values.SMOKE_USER_PHONE || '') || !phonePattern.test(values.SMOKE_OTHER_USER_PHONE || '')) {
            fail('Dedicated staging smoke phone numbers are missing or unsafe.');
          }
          if (!/^[A-Za-z0-9_-]{20,160}$/.test(values.SMOKE_FIREBASE_API_KEY)) {
            fail('The isolated staging Firebase Web API key is missing or unsafe.');
          }
          for (const [name, value] of Object.entries(values)) {
            if (/[\r\n]/.test(String(value || ''))) fail(`${name} contains a newline.`);
          }
          fs.writeFileSync(
            '.staging/account-center-qualification.env',
            `${Object.entries(values).map(([name, value]) => `${name}=${value || ''}`).join('\n')}\n`,
            { mode: 0o600 }
          );
          NODE

      - name: Create versioned backup and prove isolated restore
        if: ${{ inputs.qualification_enabled == 'true' }}
        env:
          STAGING_BACKUP_SOURCE_SHA: ${{ github.sha }}
          STAGING_BACKUP_TRANSPORT: ssh
          STAGING_RESTORE_TRANSPORT: ssh
        run: |
          set -euo pipefail
          STAGING_BACKUP_SOURCE_SHA="$(git rev-parse HEAD)" npm run staging:backup
          npm run staging:restore-drill
          npm run staging:observability

      - name: Apply and verify Account Center staging migration
        if: ${{ inputs.qualification_enabled == 'true' }}
        env:
          QUALIFICATION_ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          set -euo pipefail
          BACKUP_EVIDENCE="$(node --input-type=module -e "import fs from 'node:fs'; const state=JSON.parse(fs.readFileSync('.staging/state.json','utf8')); process.stdout.write(String(state.last_backup_s3_key || ''));")"
          [[ "${BACKUP_EVIDENCE}" =~ ^backups/[0-9]{8}-[0-9]{6}/aura-staging-backup\.tar\.gz$ ]] || {
            echo "Versioned staging backup evidence is missing."
            exit 1
          }
          {
            printf 'ACCOUNT_MIGRATION_BACKUP_EVIDENCE=%s\n' "${BACKUP_EVIDENCE}"
            printf 'ACCOUNT_MIGRATION_ROLLBACK_SHA=%s\n' "${QUALIFICATION_ROLLBACK_SHA}"
            printf 'ACCOUNT_MIGRATION_RUN_ID=account-center-%s\n' "${GITHUB_RUN_ID}"
          } >> .staging/account-center-qualification.env
          scp -F .staging/ssh_config \
            .staging/account-center-qualification.env \
            aura-staging:/tmp/account-center-qualification.env >/dev/null
          ssh -F .staging/ssh_config aura-staging "bash -s" <<'REMOTE'
          set -euo pipefail
          cleanup() {
            sudo rm -f /tmp/account-center-qualification.env
          }
          trap cleanup EXIT
          sudo chmod 600 /tmp/account-center-qualification.env
          sudo bash <<'ROOT'
          set -euo pipefail
          set -a
          source /tmp/account-center-qualification.env
          set +a
          cd /opt/aura-staging/src/infra/staging
          account_center_failure_diagnostics() {
            local exit_code="$?"
            set +e
            echo "ACCOUNT_CENTER_STAGING_DIAGNOSTICS_BEGIN"
            docker compose ps backend redis
            local backend_id
            backend_id="$(docker compose ps -a -q backend 2>/dev/null || true)"
            if [[ -n "$backend_id" ]]; then
              docker inspect --format \
                'backend status={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} oom_killed={{.State.OOMKilled}} exit_code={{.State.ExitCode}} restart_count={{.RestartCount}} error={{json .State.Error}}' \
                "$backend_id"
              docker top "$backend_id" -eo pid,ppid,stat,comm,args 2>/dev/null || true
              docker stats --no-stream --format \
                'backend memory={{.MemUsage}} memory_percent={{.MemPerc}} cpu={{.CPUPerc}} pids={{.PIDs}}' \
                "$backend_id" 2>/dev/null || true
              sleep 3
              docker inspect --format \
                'backend delayed_status={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} oom_killed={{.State.OOMKilled}} exit_code={{.State.ExitCode}} restart_count={{.RestartCount}} error={{json .State.Error}}' \
                "$backend_id" 2>/dev/null || true
              docker compose logs --no-color --since 5m backend 2>&1 \
                | grep -Ei 'runtime.*child exited|fatal|heap|allocation|out of memory|uncaught|unhandled|exception|error|SIG[A-Z]+|killed' \
                | tail -n 100 \
                | sed -E \
                    -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[REDACTED_EMAIL]/g' \
                    -e 's/((Bearer|token|secret|password|authorization)[":= ]+)[^ ,"&]+/\1[REDACTED]/gI' \
                    -e 's/([?&](X-Amz-[^=]+|token|signature|credential)=)[^& ]+/\1[REDACTED]/gI' \
                || true
            else
              echo "backend status=missing"
            fi
            local redis_id
            redis_id="$(docker compose ps -a -q redis 2>/dev/null || true)"
            if [[ -n "$redis_id" ]]; then
              docker inspect --format \
                'redis status={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} oom_killed={{.State.OOMKilled}} exit_code={{.State.ExitCode}} restart_count={{.RestartCount}} error={{json .State.Error}}' \
                "$redis_id"
              docker compose exec -T redis redis-cli ping 2>/dev/null || true
            else
              echo "redis status=missing"
            fi
            docker compose logs --no-color --since 5m backend 2>&1 \
              | grep -Ei 'redis|rate_limit|traffic\.load_shedding_denied|traffic\.attack_mode_denied' \
              | tail -n 100 \
              | sed -E \
                  -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[REDACTED_EMAIL]/g' \
                  -e 's/((Bearer|token|secret|password|authorization)[":= ]+)[^ ,"&]+/\1[REDACTED]/gI' \
                  -e 's/([?&](X-Amz-[^=]+|token|signature|credential)=)[^& ]+/\1[REDACTED]/gI' \
              || true
            free -h || true
            dmesg --ctime 2>/dev/null \
              | grep -Ei 'out of memory|oom-kill|killed process' \
              | tail -n 20 || true
            echo "ACCOUNT_CENTER_STAGING_DIAGNOSTICS_END"
            exit "$exit_code"
          }
          trap account_center_failure_diagnostics ERR
          docker compose exec -T backend \
            node scripts/migrate_account_center_v2.js \
              --mode=audit \
              "--run-id=${ACCOUNT_MIGRATION_RUN_ID}-audit" </dev/null
          docker compose exec -T \
            -e ACCOUNT_CENTER_MIGRATION_APPLY_ENABLED=true \
            backend node scripts/migrate_account_center_v2.js \
              --mode=apply \
              --execute \
              "--run-id=${ACCOUNT_MIGRATION_RUN_ID}-apply" \
              --approved-by=general-dyre-standing-approval \
              --ticket=account-center-overhaul \
              "--backup-evidence=${ACCOUNT_MIGRATION_BACKUP_EVIDENCE}" \
              "--rollback-sha=${ACCOUNT_MIGRATION_ROLLBACK_SHA}" \
              --batch-size=200 \
              --max-batches=1000 \
              --delay-ms=50 </dev/null
          docker compose exec -T \
            -e SMOKE_USER_EMAIL \
            -e SMOKE_USER_PASSWORD \
            -e SMOKE_USER_NAME \
            -e SMOKE_USER_PHONE \
            -e SMOKE_OTHER_USER_EMAIL \
            -e SMOKE_OTHER_USER_PASSWORD \
            -e SMOKE_OTHER_USER_NAME \
            -e SMOKE_OTHER_USER_PHONE \
            backend node scripts/bootstrap_staging_smoke_accounts.js </dev/null
          docker compose exec -T \
            -e SMOKE_USER_EMAIL \
            backend node scripts/verify_account_center_queries.js \
              --strict \
              --explain \
              --owner-from-env=SMOKE_USER_EMAIL </dev/null
          docker compose exec -T \
            -e SMOKE_USER_EMAIL \
            -e SMOKE_USER_PASSWORD \
            -e SMOKE_USER_NAME \
            -e SMOKE_USER_PHONE \
            -e SMOKE_OTHER_USER_EMAIL \
            -e SMOKE_OTHER_USER_PASSWORD \
            -e SMOKE_OTHER_USER_NAME \
            -e SMOKE_OTHER_USER_PHONE \
            -e SMOKE_FIREBASE_API_KEY \
            -e SMOKE_BASE_URL \
            -e SMOKE_TARGET_ENV \
            -e SMOKE_STAGING_ISOLATED \
            -e STAGING_SSM_PREFIX \
            -e PROD_BASE_URL \
            -e PROD_API_BASE_URL \
            backend node scripts/account_center_staging_smoke.js </dev/null
          metrics_secret="$(sed -n 's/^METRICS_SECRET=//p' .env.staging | tail -n 1)"
          backend_port="$(sed -n 's/^PORT=//p' .env.staging | tail -n 1)"
          [[ "$metrics_secret" =~ ^[A-Za-z0-9._-]{32,256}$ ]] || {
            echo "Staging metrics credential is missing or invalid."
            exit 1
          }
          [[ "${backend_port:-3000}" =~ ^[0-9]{2,5}$ ]] || {
            echo "Staging backend port is invalid."
            exit 1
          }
          metrics_output="$(mktemp)"
          trap 'rm -f "$metrics_output"' EXIT
          backend_container_id="$(docker compose ps -q backend)"
          [[ -n "$backend_container_id" ]] || {
            echo "Staging backend container is missing before metrics scrape."
            exit 1
          }
          backend_restarts_before="$(docker inspect --format '{{.RestartCount}}' "$backend_container_id")"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            "http://127.0.0.1:${backend_port:-3000}/health/live" >/dev/null
          echo "ACCOUNT_CENTER_PRE_METRICS_LIVENESS_PASS"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 30 \
            -H "x-metrics-key: ${metrics_secret}" \
            "http://127.0.0.1:${backend_port:-3000}/metrics" > "$metrics_output"
          missing_metrics=()
          require_metric() {
            local name="$1"
            local pattern="$2"
            grep -Eq "$pattern" "$metrics_output" || missing_metrics+=("$name")
          }
          require_metric \
            "product events" \
            '^aura_account_product_events_total\{[^}]*event="account\.section_viewed"[^}]*\} [1-9][0-9]*(\.[0-9]+)?$'
          require_metric \
            "account operations" \
            '^aura_account_operations_total\{[^}]*\} [1-9][0-9]*(\.[0-9]+)?$'
          require_metric \
            "account operation duration" \
            '^aura_account_operation_duration_seconds_count\{[^}]*\} [1-9][0-9]*(\.[0-9]+)?$'
          require_metric \
            "completed apply migration" \
            '^aura_account_migration_runs_total\{mode="apply",status="completed"\} [1-9][0-9]*(\.[0-9]+)?$'
          if (( ${#missing_metrics[@]} > 0 )); then
            printf 'missing non-zero Account Center metrics: %s\n' "$(IFS=', '; echo "${missing_metrics[*]}")"
            exit 1
          fi
          sleep 10
          backend_container_id_after="$(docker compose ps -q backend)"
          [[ -n "$backend_container_id_after" ]] || {
            echo "Staging backend container is missing after metrics scrape."
            exit 1
          }
          backend_restarts_after="$(docker inspect --format '{{.RestartCount}}' "$backend_container_id_after")"
          if [[ "$backend_container_id_after" != "$backend_container_id" || "$backend_restarts_after" != "$backend_restarts_before" ]]; then
            echo "Staging backend restarted during Account Center metrics verification."
            exit 1
          fi
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            "http://127.0.0.1:${backend_port:-3000}/health/live" >/dev/null
          echo "ACCOUNT_CENTER_METRICS_PASS"
          ROOT
          REMOTE

      - name: Setup k6 for authenticated Account Center load
        if: ${{ inputs.qualification_enabled == 'true' }}
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      - name: Run authenticated Account Center load gate
        if: ${{ inputs.qualification_enabled == 'true' }}
        run: |
          set -euo pipefail
          set -a
          source .staging/account-center-qualification.env
          set +a
          node scripts/performance/run-account-center-k6.mjs

      - name: Run responsive authenticated Account Center browser gate
        if: ${{ inputs.qualification_enabled == 'true' }}
        run: |
          set -euo pipefail
          set -a
          source .staging/account-center-qualification.env
          set +a
          npm --prefix app exec -- playwright install --with-deps chromium
          npm --prefix app exec -- playwright test --config=app/playwright.staging.config.js
        env:
          ACCOUNT_CENTER_STAGING_E2E: "true"

      - name: Upload Account Center qualification evidence
        if: ${{ always() && inputs.qualification_enabled == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: account-center-staging-${{ github.run_id }}
          path: |
            .run-logs/k6-account-center.json
            app/playwright-report-account-staging
            app/test-results/account-center-staging
          if-no-files-found: warn
          retention-days: 14

      - name: Remove Account Center qualification credentials
        if: ${{ always() && inputs.qualification_enabled == 'true' }}
        run: rm -f .staging/account-center-qualification.env

      - name: Revoke runner SSH access
        if: ${{ always() && steps.lease-runner-ssh.outputs.security_group_rule_id != '' }}
        env:
          LEASED_SECURITY_GROUP_ID: ${{ steps.lease-runner-ssh.outputs.security_group_id }}
          LEASED_SECURITY_GROUP_RULE_ID: ${{ steps.lease-runner-ssh.outputs.security_group_rule_id }}
        run: |
          set -euo pipefail
          test -n "${LEASED_SECURITY_GROUP_ID}"
          test -n "${LEASED_SECURITY_GROUP_RULE_ID}"
          aws ec2 revoke-security-group-ingress \
            --region "${AWS_REGION}" \
            --group-id "${LEASED_SECURITY_GROUP_ID}" \
            --security-group-rule-ids "${LEASED_SECURITY_GROUP_RULE_ID}" >/dev/null
          echo "Revoked temporary runner SSH access."
