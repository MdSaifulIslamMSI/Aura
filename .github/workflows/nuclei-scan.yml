name: Nuclei Scan

# Template-driven live vulnerability scanning (known CVEs, exposed assets,
# misconfigurations) against the AURA storefront. OWASP ZAP covers passive
# spider findings; Nuclei covers template-matched exposures and known-CVE
# signatures against the running application.
#
# Gate policy (docs/security/nuclei-policy.md): runs are non-blocking until the
# triaged baseline in nuclei-exceptions.json is clean. Promotion to a blocking
# gate happens via a workflow_dispatch run with enforce=true, which reruns the
# scan in strict mode. This workflow never runs on pull_request.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      enforce:
        description: Run in strict mode and block on unsuppressed high/critical findings
        required: false
        default: false
        type: boolean
      target:
        description: Override the scan target (must be a local, staging, or preview origin)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nuclei-scan-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24.x
  NUCLEI_IMAGE: projectdiscovery/nuclei:v3.11.1
  STAGING_URL: ${{ vars.STAGING_URL || '' }}

jobs:
  nuclei-scan:
    name: Nuclei Template Scan
    runs-on: ubuntu-latest
    # Template sync (~10 min on a cold cache) + a full tag-set scan of a SPA
    # (verified locally: >15 minutes, every route returns 200 so every template
    # fires). Do not tighten below this without a scope reduction.
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The nuclei image ships without templates; the runner syncs them into
      # .nucleicache (see scripts/security/run-docker-tool.mjs). CI runners start
      # empty, so cache the template set between nightly runs.
      - name: Cache nuclei templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nucleicache
          key: nuclei-templates-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nuclei-templates-${{ runner.os }}-

      - name: Resolve Nuclei target
        id: nuclei-target
        shell: bash
        env:
          OVERRIDE_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [ -n "$OVERRIDE_TARGET" ]; then
            echo "target=$OVERRIDE_TARGET" >> "$GITHUB_OUTPUT"
            echo "mode=operator-override" >> "$GITHUB_OUTPUT"
          elif [ -n "$STAGING_URL" ]; then
            npm run smoke:preflight
            echo "target=$STAGING_URL" >> "$GITHUB_OUTPUT"
            echo "mode=external-staging" >> "$GITHUB_OUTPUT"
          else
            echo "target=http://127.0.0.1:4173" >> "$GITHUB_OUTPUT"
            echo "mode=local-preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend dependencies
        if: steps.nuclei-target.outputs.mode == 'local-preview'
        run: npm --prefix app ci

      - name: Build local frontend preview
        if: steps.nuclei-target.outputs.mode == 'local-preview'
        run: npm --prefix app run build

      - name: Start local frontend preview
        if: steps.nuclei-target.outputs.mode == 'local-preview'
        shell: bash
        run: |
          npm --prefix app run preview -- --host 0.0.0.0 --port 4173 > "$RUNNER_TEMP/aura-vite-preview.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/aura-vite-preview.pid"
          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:4173" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/aura-vite-preview.log"
          exit 1

      # Baseline mode reports every finding but exits zero; strict mode (enforce
      # input) exits non-zero on unsuppressed high/critical findings.
      - name: Run Nuclei scan
        shell: bash
        env:
          NUCLEI_TARGET: ${{ steps.nuclei-target.outputs.target }}
          ENFORCE: ${{ inputs.enforce }}
        run: |
          set -euo pipefail
          if [ "$ENFORCE" = "true" ] || [ "$ENFORCE" = "True" ]; then
            npm run security:nuclei:strict -- "$NUCLEI_TARGET"
          else
            npm run security:nuclei -- "$NUCLEI_TARGET"
          fi

      - name: Upload Nuclei reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: nuclei-scan-report
          path: |
            security-reports/nuclei-report.jsonl
            security-reports/nuclei-report.sarif
            security-reports/nuclei-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Nuclei SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always() && hashFiles('security-reports/nuclei-report.sarif') != ''
        with:
          sarif_file: security-reports/nuclei-report.sarif
          category: nuclei
