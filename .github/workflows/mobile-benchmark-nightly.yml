name: Mobile Benchmark Nightly

on:
  schedule:
    # 21:30 UTC = 03:00 IST nightly, off-peak for the ap-south-1 audience.
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-benchmark-nightly
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24.x

jobs:
  benchmark:
    name: Run mobile benchmark with budget assertions
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix app ci

      - name: Install Playwright Chromium
        run: app/node_modules/.bin/playwright install --with-deps chromium

      - name: Build production frontend
        run: npm --prefix app run build

      - name: Start production preview server
        run: |
          npm --prefix app run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/aura-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/aura-preview.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173" > /dev/null; then
              echo "Preview server is up."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/aura-preview.log"
          exit 1

      - name: Run mobile benchmark with budget assertions
        run: npm --prefix app run bench:mobile -- --assert --flows=off
        env:
          # Interaction flows need a live backend and a populated catalog. This
          # job serves a static `vite preview`, so any flow that reaches a
          # product listing renders "Showing 0 of 0 items" and cannot pass.
          # Lighthouse scoring works fine against the static build; interaction
          # coverage is owned by the Playwright E2E suite (app/e2e), which boots
          # scripts/start_e2e_server.mjs and runs a Pixel 7 project.
          MOBILE_BENCHMARK_FLOWS: "off"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-benchmark-report
          path: docs/reports/mobile-benchmark.latest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop preview server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/aura-preview.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/aura-preview.pid")" 2>/dev/null || true
          fi
