name: Performance

on:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  performance-smoke:
    # PR smoke only — the nightly stress/spike lane covers scheduled runs.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            server/package-lock.json

      - name: Install
        run: npm ci

      - name: Install app dependencies
        run: npm --prefix app ci

      - name: Install server dependencies
        run: npm --prefix server install

      - name: Performance audit
        run: npm run perf:audit

      - name: Local performance services check
        run: npm run perf:local

      - name: Lint if present
        run: npm run lint --if-present

      - name: Typecheck if present
        run: npm run typecheck --if-present

      - name: Cache safety tests
        run: node scripts/run-test-tier.cjs server performance-cache --forceExit

      - name: Setup k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      - name: Build local frontend performance target
        if: ${{ github.event_name == 'pull_request' || (vars.PERF_BASE_URL || '') == '' || (vars.PERF_API_BASE_URL || '') == '' }}
        run: npm --prefix app run build

      - name: Start local performance targets
        if: ${{ github.event_name == 'pull_request' || (vars.PERF_BASE_URL || '') == '' || (vars.PERF_API_BASE_URL || '') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --build mongo redis aura-api
          npm --prefix app run preview -- --host 0.0.0.0 --port 3000 > "${RUNNER_TEMP}/aura-vite-preview.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/aura-vite-preview.pid"

          for attempt in $(seq 1 45); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:5000/health >/dev/null 2>&1 &&
               curl --fail --silent --max-time 5 http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "Local performance targets are ready."
              exit 0
            fi
            sleep 4
          done

          echo "Local performance targets did not become reachable." >&2
          docker compose ps >&2 || true
          docker compose logs --no-color aura-api >&2 || true
          cat "${RUNNER_TEMP}/aura-vite-preview.log" >&2 || true
          exit 1

      - name: Performance smoke
        run: npm run perf:smoke
        env:
          PERF_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:3000' || vars.PERF_BASE_URL || 'http://127.0.0.1:3000' }}
          PERF_API_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:5000' || vars.PERF_API_BASE_URL || 'http://127.0.0.1:5000' }}

      - name: k6 load
        run: npm run perf:load
        env:
          PERF_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:3000' || vars.PERF_BASE_URL || 'http://127.0.0.1:3000' }}
          PERF_API_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:5000' || vars.PERF_API_BASE_URL || 'http://127.0.0.1:5000' }}
          PERF_P95_MS: ${{ vars.PERF_P95_MS || '500' }}
          PERF_ERROR_RATE: ${{ vars.PERF_ERROR_RATE || '0.01' }}

      - name: Lighthouse if configured URL available
        if: ${{ github.event_name != 'pull_request' && (vars.PERF_BASE_URL || '') != '' }}
        run: npm run perf:lighthouse
        env:
          PERF_BASE_URL: ${{ vars.PERF_BASE_URL || 'http://127.0.0.1:3000' }}
          LIGHTHOUSE_MIN_PERFORMANCE: ${{ vars.LIGHTHOUSE_MIN_PERFORMANCE || '0.85' }}

      - name: Performance budget
        run: npm run perf:budget
        env:
          PERF_P95_MS: ${{ vars.PERF_P95_MS || '500' }}
          PERF_ERROR_RATE: ${{ vars.PERF_ERROR_RATE || '0.01' }}
          LIGHTHOUSE_MIN_PERFORMANCE: ${{ vars.LIGHTHOUSE_MIN_PERFORMANCE || '0.85' }}

      - name: Stop local performance targets
        if: always()
        shell: bash
        run: |
          if [ -f "${RUNNER_TEMP}/aura-vite-preview.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/aura-vite-preview.pid")" 2>/dev/null || true
          fi
          docker compose down -v --remove-orphans || true

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-artifacts
          path: |
            .run-logs/k6-*.json
            .run-logs/lighthouse
            summary.json
          if-no-files-found: ignore

      - name: Comment PR summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const status = '${{ job.status }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Performance Smoke completed with status: ${status}.\n\nChecks: perf:audit, lint/typecheck if present, cache safety tests, perf:smoke, perf:load, perf:lighthouse when reachable, perf:budget.`
            });

  performance-nightly:
    # Scheduled stress/spike only — never on PRs.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_URL: ${{ vars.PERF_BASE_URL || vars.STAGING_BASE_URL || '' }}
      PERF_ALLOW_PRODUCTION: ${{ vars.PERF_ALLOW_PRODUCTION || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Guard target
        shell: bash
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "No PERF_BASE_URL or STAGING_BASE_URL configured; skipping nightly performance run."
            exit 0
          fi
          if echo "$TARGET_URL" | grep -Eiq '(^https://)?(www\.)?(prod|production)\.' && [ "$PERF_ALLOW_PRODUCTION" != "true" ]; then
            echo "Refusing to run nightly performance tests against a production-looking target without PERF_ALLOW_PRODUCTION=true."
            exit 1
          fi

      - name: Setup k6
        if: ${{ env.TARGET_URL != '' }}
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      - name: Stress test
        if: ${{ env.TARGET_URL != '' }}
        run: npm run perf:stress
        env:
          PERF_BASE_URL: ${{ env.TARGET_URL }}
          PERF_API_BASE_URL: ${{ env.TARGET_URL }}
          PERF_P95_MS: ${{ vars.PERF_P95_MS || '500' }}
          PERF_ERROR_RATE: ${{ vars.PERF_ERROR_RATE || '0.01' }}

      - name: Spike test
        if: ${{ env.TARGET_URL != '' }}
        run: node scripts/performance/run-k6.mjs spike
        env:
          PERF_BASE_URL: ${{ env.TARGET_URL }}
          PERF_API_BASE_URL: ${{ env.TARGET_URL }}
          PERF_P95_MS: ${{ vars.PERF_P95_MS || '500' }}
          PERF_ERROR_RATE: ${{ vars.PERF_ERROR_RATE || '0.01' }}
