name: OpenSSF Scorecard
# Supply-chain posture scoring per the OpenSSF baseline. Results publish to
# the repo's security dashboard (public repo) and upload as SARIF to code
# scanning. Weekly schedule keeps the score current between main pushes.

on:
  branch_protection_rule:
  schedule:
    - cron: '53 4 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ossf-scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # The Token-Permissions gate in this repository reproduces Scorecard's
      # scoring by hand. This step compares that port with the upstream
      # sources it was derived from, so a model change upstream cannot leave
      # the gate reporting 10/10 while the real Scorecard score drops.
      #
      # Scheduled only: a drift needs a human to re-derive the port, and
      # failing a push to main for that would block releases over a change
      # nobody made yet.
      - name: Check the ported Token-Permissions model against upstream
        if: github.event_name == 'schedule'
        run: node scripts/security/check-scorecard-model-drift.mjs

      - name: Upload analysis artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
