name: Actions Security Audit
# zizmor v1 audit of every GitHub Actions workflow (template injection,
# credential persistence, excessive permissions, dangerous triggers, ...).
#
# TWO TIERS:
#  1. zizmor (SARIF report, non-blocking): reports ALL findings to code
#     scanning, including the review-required classes (template-injection,
#     excessive-permissions, dangerous-triggers) tracked in
#     docs/security-actions-audit-policy.md.
#  2. regression-gate (BLOCKING): fails on any finding from audit classes
#     eliminated in the 2026-08 hardening batch (artipacked, unpinned-uses).

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/security/actions-audit-regression-gate.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: actions-audit-`${{ github.workflow }}-`${{ github.ref }}
  cancel-in-progress: true

env:
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:v1.29.0

jobs:
  zizmor:
    name: zizmor workflow audit (SARIF report)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run zizmor audit
        uses: zizmorcore/zizmor-action@7999d8c8ac51dbd3bd44e6e35e7cd015b5dcdc82 # v0.6.2
        with:
          persona: regular
          format: sarif
          output-path: zizmor.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: zizmor.sarif

  regression-gate:
    name: Regression gate (artipacked / unpinned-uses = zero tolerance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run zizmor (JSON)
        run: docker run --rm -v `"`$PWD:/repo`" `"`$ZIZMOR_IMAGE`" --no-progress --format json /repo/.github/workflows/ > findings.json

      - name: Enforce regression gate
        run: node scripts/security/actions-audit-regression-gate.mjs findings.json
