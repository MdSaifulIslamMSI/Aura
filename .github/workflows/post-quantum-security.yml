name: Post-Quantum Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-quantum-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pqc-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate crypto inventory
        run: npm run security:pqc:inventory

      - name: Upload crypto inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pqc-crypto-inventory
          path: |
            reports/security/crypto-inventory.json
            reports/security/crypto-inventory.md
          retention-days: 14

  pqc-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PQC policy check
        run: npm run security:pqc:policy

      - name: Upload PQC policy reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pqc-policy-reports
          path: |
            reports/security/crypto-inventory.json
            reports/security/crypto-inventory.md
            reports/security/pqc-policy-check.json
            reports/security/pqc-policy-check.md
          retention-days: 14

  pqc-deployment-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate controllable-surface PQC deployment proof
        run: npm run security:pqc:proof:strict

      - name: Generate PQC maturity scorecard
        run: npm run security:pqc:scorecard:strict

      - name: Verify provider dependency register
        run: npm run security:pqc:provider-register

      - name: Generate real-target PQC proof envelope
        run: npm run security:pqc:real-target

      - name: Upload PQC deployment proof reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pqc-deployment-proof-reports
          path: |
            reports/security/pqc-deployment-proof.json
            reports/security/pqc-deployment-proof.md
            reports/security/ssh-pqc-readiness.json
            reports/security/ssh-pqc-readiness.md
            reports/security/ssh-pqc-environment-proof.json
            reports/security/ssh-pqc-environment-proof.md
            reports/security/tls-config-readiness.json
            reports/security/tls-config-readiness.md
            reports/security/tls-endpoint-pqc-readiness.json
            reports/security/tls-endpoint-pqc-readiness.md
            reports/security/pqc-lab-smoke.json
            reports/security/pqc-lab-smoke.md
            reports/security/pqc-lab-benchmark.json
            reports/security/pqc-lab-benchmark.md
            reports/security/internal-service-encryption-check.json
            reports/security/internal-service-encryption-check.md
            reports/security/internal-service-encryption-evidence.json
            reports/security/internal-service-encryption-evidence.md
            reports/security/backup-crypto-agility-check.json
            reports/security/backup-crypto-agility-check.md
            reports/security/backup-pqc-encryption-evidence.json
            reports/security/backup-pqc-encryption-evidence.md
            reports/security/release-signing-readiness.json
            reports/security/release-signing-readiness.md
            reports/security/pqc-provider-register-check.json
            reports/security/pqc-provider-register-check.md
            reports/security/pqc-real-target-proof.json
            reports/security/pqc-real-target-proof.md
            reports/security/pqc-maturity-scorecard.json
            reports/security/pqc-maturity-scorecard.md
          if-no-files-found: error
          retention-days: 14

  pqc-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Run PQC primitive and integration tests
        run: node scripts/run-test-tier.cjs server pqc --forceExit

      - name: Verify default-safe runtime status
        run: npm run security:pqc:runtime:strict

      - name: Verify configured runtime with generated keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pqc-smoke"
          node scripts/security/pqc-keygen.mjs --type hybrid-kem --out "$RUNNER_TEMP/pqc-smoke/field-kem.json"
          node scripts/security/pqc-keygen.mjs --type hybrid-signature --out "$RUNNER_TEMP/pqc-smoke/ledger-signing.json"
          FIELD_ENCRYPTION_ENABLED=true \
          FIELD_ENCRYPTION_PQC_MODE=key-wrap \
          FIELD_ENCRYPTION_PQC_KEM_KEY_REF="file:$RUNNER_TEMP/pqc-smoke/field-kem.json" \
          SECURITY_EVENT_LEDGER_ENABLED=true \
          SECURITY_EVENT_LEDGER_PQC_MODE=require \
          SECURITY_EVENT_LEDGER_PQC_SIGNING_KEY_REF="file:$RUNNER_TEMP/pqc-smoke/ledger-signing.json" \
          npm run security:pqc:runtime:strict

      - name: Generate CBOM
        run: npm run security:pqc:cbom:strict

      - name: Upload PQC runtime and CBOM reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pqc-runtime-cbom
          path: |
            reports/security/cbom.json
            reports/security/cbom.md
            reports/security/pqc-runtime-status.json
            reports/security/pqc-runtime-status.md
          if-no-files-found: warn
          retention-days: 14

  semgrep-pqc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare report directory
        run: mkdir -p reports/security

      - name: Run Semgrep PQC rules
        id: semgrep-scan
        # The PQC scan is a security gate: a failed or unrunnable Semgrep must
        # fail the job instead of reporting green. The step keeps an id so the
        # step below can still explain the failure.
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 semgrep scan --config security/semgrep/pqc-crypto-policy.yml --sarif --output reports/security/semgrep-pqc.sarif .

      - name: Note Semgrep unavailable
        if: always() && steps.semgrep-scan.outcome != 'success'
        run: echo "Semgrep CE did not run successfully in this runner; the PQC scan is blocking, so this job fails. npm run security:pqc also enforces blocker policy."

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always() && hashFiles('reports/security/semgrep-pqc.sarif') != ''
        with:
          sarif_file: reports/security/semgrep-pqc.sarif
          category: semgrep-pqc

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pqc-semgrep
          path: reports/security/semgrep-pqc.sarif
          if-no-files-found: ignore
          retention-days: 14
