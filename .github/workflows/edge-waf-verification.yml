name: Edge WAF Verification
# Proves the free ModSecurity/CRS + CrowdSec edge stack actually blocks the
# attack classes the removed AWS WAF used to cover (SQLi, XSS, traversal,
# command injection) while passing benign traffic. Runs the compose stack
# from infra/edge with the verify-profile mock backend.

on:
  pull_request:
    paths:
      - 'infra/edge/**'
      - 'scripts/security/edge-waf-verification.mjs'
      - '.github/workflows/edge-waf-verification.yml'
  push:
    branches: [main]
    paths:
      - 'infra/edge/**'
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-waf-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CRS blocks attacks, passes benign traffic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Start edge WAF stack
        run: docker compose -f infra/edge/docker-compose.yml --profile verify up -d --wait

      - name: Verify WAF blocking and pass-through behavior
        run: node scripts/security/edge-waf-verification.mjs --base-url http://127.0.0.1:8080

      - name: Verify CrowdSec parses WAF traffic (acquisition pipeline)
        run: |
          set -euo pipefail
          METRICS=$(docker compose -f infra/edge/docker-compose.yml exec -T crowdsec cscli metrics)
          echo "$METRICS" | grep -q "Local API Metrics" || { echo "crowdsec metrics unavailable"; exit 1; }
          LINES_PARSED=$(echo "$METRICS" | grep -Ei "lines[_ ]parsed" -A3 | grep -oE "[0-9]+" | head -1 || echo 0)
          LINES_PARSED=${LINES_PARSED:-0}
          echo "lines parsed by acquisition: ${LINES_PARSED}"
          test "${LINES_PARSED}" -gt 0 || { echo "crowdsec acquisition parsed 0 lines — log pipeline broken"; exit 1; }

      - name: Verify bouncer registration and decision lifecycle
        run: |
          set -euo pipefail
          KEY=$(docker compose -f infra/edge/docker-compose.yml exec -T crowdsec \
            cscli bouncers add ci-verify-bouncer -o raw)
          test -n "${KEY}" || { echo "bouncer key generation failed"; exit 1; }
          docker compose -f infra/edge/docker-compose.yml exec -T crowdsec \
            cscli bouncers list -o json | grep -q ci-verify-bouncer \
            || { echo "bouncer registration not visible"; exit 1; }
          docker compose -f infra/edge/docker-compose.yml exec -T crowdsec \
            cscli decisions add --ip 203.0.113.50 --duration 4h --reason ci-verification >/dev/null
          docker compose -f infra/edge/docker-compose.yml exec -T crowdsec \
            cscli decisions list --ip 203.0.113.50 -o json | grep -q 203.0.113.50 \
            || { echo "decision not registered"; exit 1; }
          echo "bouncer + decision lifecycle verified"

      - name: Dump WAF logs on failure
        if: failure()
        run: docker compose -f infra/edge/docker-compose.yml logs waf crowdsec | tail -100

      - name: Tear down stack
        if: always()
        run: docker compose -f infra/edge/docker-compose.yml --profile verify down -v
