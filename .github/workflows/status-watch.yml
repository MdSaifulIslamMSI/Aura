name: Status Watch

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] — metadata-only webhook job, no code checkout
    workflows:
      - Production Release Gate On Main Push
      - CI
      - Quality Foundation
      - Security Gates
      - CodeQL
      - Payment Architecture
      - Docker
      - staging-frontend-smoke
      - Deploy Backend To AWS
      - Deploy Storefront To Multi-Host Platforms
      - Deploy Gateway To Vercel
      - Desktop Release
      - Mobile Release
    types:
      - completed

permissions: {}

# A busy main push completes ~5 watched workflows at once; each completion
# spawns a watch run and this group collapses the burst (cancelled runs are
# superseded duplicates, by design). The group is scoped to the triggering
# commit's SHA so a newer commit can never cancel a still-in-flight watch for
# an older one — every commit's final state reaches the status webhook exactly
# once.
concurrency:
  group: status-watch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Notify Aura status system
        run: |
          if [ -z "$STATUS_WEBHOOK_URL" ] || [ -z "$STATUS_WEBHOOK_TOKEN" ]; then
            echo "Status webhook secrets are not configured; skipping status notification."
            exit 0
          fi

          curl -X POST "$STATUS_WEBHOOK_URL" \
            -H "Authorization: Bearer $STATUS_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "source": "github_actions",
              "workflow": "${WORKFLOW_NAME}",
              "conclusion": "${WORKFLOW_CONCLUSION}",
              "sha": "${WORKFLOW_SHA}",
              "url": "${WORKFLOW_URL}"
            }'
        env:
          STATUS_WEBHOOK_URL: ${{ secrets.STATUS_WEBHOOK_URL }}
          STATUS_WEBHOOK_TOKEN: ${{ secrets.STATUS_WEBHOOK_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
