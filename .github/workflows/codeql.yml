name: CodeQL

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 2"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: "/language:${{ matrix.language }}"
          # Keep the report the action uploads to GitHub on disk as well, so
          # the gate below can fail the build on findings that would
          # otherwise only appear in the Security tab days later.
          output: ${{ runner.temp }}/codeql-results

      # GitHub's code-scanning alerts do not fail a pull request: the
      # `javascript-typescript` check is a required status check, but it
      # succeeds as long as the analysis completes. This step is what turns
      # a new CodeQL finding into a red build.
      - name: Fail on CodeQL findings that are not accepted
        run: node scripts/security/check-codeql-sarif.mjs --sarif "${{ runner.temp }}/codeql-results"
