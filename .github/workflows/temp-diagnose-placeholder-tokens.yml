name: TEMP diagnose placeholder provider tokens

# TEMPORARY diagnostic. Reports ONLY a classification per secret:
#   DASH   -> the value is exactly "-"
#   EMPTY  -> unset or empty
#   SET    -> a real value
# It never prints a secret value, never prints a length, and never hashes.
# Delete this workflow once the diagnosis is complete.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify secrets without revealing them
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_FRONTEND_DEPLOY_ROLE_ARN: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          AZURE_RUNTIME_ENV_FILE: ${{ secrets.AZURE_RUNTIME_ENV_FILE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DEPENDABOT_MERGE_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          METRICS_SECRET: ${{ secrets.METRICS_SECRET }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_DD_APPLICATION_ID: ${{ secrets.VITE_DD_APPLICATION_ID }}
          VITE_DD_CLIENT_TOKEN: ${{ secrets.VITE_DD_CLIENT_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          classify() {
            local name="$1" value="$2"
            if [ -z "${value}" ]; then
              echo "RESULT ${name} EMPTY"
            elif [ "${value}" = "-" ]; then
              echo "RESULT ${name} DASH"
            else
              echo "RESULT ${name} SET"
            fi
          }
          classify ANDROID_RELEASE_KEYSTORE_BASE64 "${ANDROID_RELEASE_KEYSTORE_BASE64}"
          classify ANDROID_RELEASE_KEYSTORE_PASSWORD "${ANDROID_RELEASE_KEYSTORE_PASSWORD}"
          classify ANDROID_RELEASE_KEY_ALIAS "${ANDROID_RELEASE_KEY_ALIAS}"
          classify ANDROID_RELEASE_KEY_PASSWORD "${ANDROID_RELEASE_KEY_PASSWORD}"
          classify AWS_DEPLOY_ROLE_ARN "${AWS_DEPLOY_ROLE_ARN}"
          classify AWS_FRONTEND_DEPLOY_ROLE_ARN "${AWS_FRONTEND_DEPLOY_ROLE_ARN}"
          classify AZURE_RUNTIME_ENV_FILE "${AZURE_RUNTIME_ENV_FILE}"
          classify CLOUDFLARE_ACCOUNT_ID "${CLOUDFLARE_ACCOUNT_ID}"
          classify CLOUDFLARE_API_TOKEN "${CLOUDFLARE_API_TOKEN}"
          classify DATADOG_API_KEY "${DATADOG_API_KEY}"
          classify DEPENDABOT_MERGE_TOKEN "${DEPENDABOT_MERGE_TOKEN}"
          classify GH_PAGES_TOKEN "${GH_PAGES_TOKEN}"
          classify GRAFANA_ADMIN_PASSWORD "${GRAFANA_ADMIN_PASSWORD}"
          classify METRICS_SECRET "${METRICS_SECRET}"
          classify NETLIFY_AUTH_TOKEN "${NETLIFY_AUTH_TOKEN}"
          classify NPM_TOKEN "${NPM_TOKEN}"
          classify RAILWAY_API_TOKEN "${RAILWAY_API_TOKEN}"
          classify RENDER_API_KEY "${RENDER_API_KEY}"
          classify SENTRY_AUTH_TOKEN "${SENTRY_AUTH_TOKEN}"
          classify SENTRY_ORG "${SENTRY_ORG}"
          classify SENTRY_PROJECT "${SENTRY_PROJECT}"
          classify VERCEL_TOKEN "${VERCEL_TOKEN}"
          classify VITE_DD_APPLICATION_ID "${VITE_DD_APPLICATION_ID}"
          classify VITE_DD_CLIENT_TOKEN "${VITE_DD_CLIENT_TOKEN}"
          classify VITE_SENTRY_DSN "${VITE_SENTRY_DSN}"
          classify VITE_TURNSTILE_SITE_KEY "${VITE_TURNSTILE_SITE_KEY}"
