name: AI Guard Red-Team Eval
# Runs the promptfoo red-team corpus against the assistant prompt guard
# (deterministic — no LLM calls, no API keys). Fails the job on any
# false-negative (attack that passes) or false-positive (benign blocked).

on:
  pull_request:
    paths:
      - 'server/services/ai/promptGuardService.js'
      - 'server/controllers/aiController.js'
      - 'security/ai/**'
      - '.github/workflows/ai-guard-eval.yml'
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-guard-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: promptfoo red-team eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Run promptfoo red-team eval
        run: npx --yes promptfoo@0.122.2 eval -c security/ai/promptfooconfig.yaml --no-cache --output promptfoo-output.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promptfoo-results
          path: promptfoo-output.json
          retention-days: 30
