version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /app
      - /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-bump:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /
      - /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-bump:
        patterns:
          - "*"
