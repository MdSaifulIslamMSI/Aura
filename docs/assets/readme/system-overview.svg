<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Aura Marketplace system overview</title>
  <desc id="desc">A high-level diagram showing users entering the Aura gateway and storefront hosts, then flowing through same-origin runtime paths to the shared API, worker runtime, data stores, and external providers. All styling is inlined per element because GitHub's SVG sanitizer strips style blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.52" stop-color="#0b1726"/>
      <stop offset="1" stop-color="#0a1f21"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10263a"/>
      <stop offset="1" stop-color="#0b2028"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#39d8cf"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="34" y="32" width="1212" height="656" rx="30" fill="none" stroke="#123a4b" stroke-width="2"/>

  <text x="70" y="86" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Aura Marketplace runtime map</text>
  <text x="72" y="116" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">One storefront artifact, gated release lanes, split runtime — and dependencies that merge themselves under policy.</text>

  <rect x="72" y="158" width="185" height="90" rx="18" fill="#062f34" stroke="#20d5c6" stroke-width="2"/>
  <text x="104" y="194" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Users</text>
  <text x="104" y="222" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">Web, mobile, desktop</text>

  <rect x="330" y="132" width="230" height="78" rx="18" fill="url(#panel)" stroke="#14536a" stroke-width="2"/>
  <text x="360" y="166" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Gateway</text>
  <text x="360" y="193" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">aura-gateway.vercel.app</text>

  <rect x="330" y="238" width="230" height="108" rx="18" fill="#062f34" stroke="#20d5c6" stroke-width="2"/>
  <text x="360" y="276" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">React storefront</text>
  <text x="360" y="304" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">Vercel · Netlify · CloudFront</text>
  <text x="360" y="329" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">Render · CF Pages · GH Pages</text>

  <rect x="650" y="152" width="270" height="126" rx="18" fill="#1d1f2d" stroke="#6c78ff" stroke-width="2"/>
  <text x="682" y="190" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Same-origin paths</text>
  <text x="682" y="218" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">/api, /health</text>
  <text x="682" y="244" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">/socket.io, /uploads</text>

  <rect x="1000" y="130" width="210" height="100" rx="18" fill="#062f34" stroke="#20d5c6" stroke-width="2"/>
  <text x="1030" y="168" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">API runtime</text>
  <text x="1030" y="196" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">Express, auth, commerce</text>

  <rect x="1000" y="272" width="210" height="100" rx="18" fill="url(#panel)" stroke="#14536a" stroke-width="2"/>
  <text x="1030" y="310" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Worker runtime</text>
  <text x="1030" y="338" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">jobs, queues, replay</text>

  <rect x="172" y="456" width="232" height="112" rx="18" fill="url(#panel)" stroke="#14536a" stroke-width="2"/>
  <text x="204" y="494" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Identity</text>
  <text x="204" y="522" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">Firebase, Duo, CSRF</text>
  <text x="204" y="548" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">trusted device, OTP</text>

  <rect x="476" y="456" width="232" height="112" rx="18" fill="url(#panel)" stroke="#14536a" stroke-width="2"/>
  <text x="508" y="494" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Data plane</text>
  <text x="508" y="522" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">MongoDB, Redis</text>
  <text x="508" y="548" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">catalog, sessions, queues</text>

  <rect x="780" y="456" width="232" height="112" rx="18" fill="url(#panel)" stroke="#14536a" stroke-width="2"/>
  <text x="812" y="494" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Providers</text>
  <text x="812" y="522" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">Payments, email, S3</text>
  <text x="812" y="548" fill="#a8bfce" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">AI: Gemini · Groq · Ollama</text>

  <rect x="90" y="606" width="480" height="42" rx="18" fill="#081925" stroke="#27536a" stroke-width="1.5"/>
  <text x="112" y="633" fill="#8da7b8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="1">GATED PRS  -&gt;  MAIN GATES  -&gt;  PRODUCTION COMMAND CENTER</text>
  <rect x="640" y="606" width="470" height="42" rx="18" fill="#081925" stroke="#27536a" stroke-width="1.5"/>
  <text x="662" y="633" fill="#8da7b8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="1">POLICY AUTOMERGE  -&gt;  7D COOLDOWN  -&gt;  PAT-ARMED MERGE</text>

  <path d="M257 202 C286 202 296 171 330 171" fill="none" stroke="#39d8cf" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M257 202 C286 202 296 292 330 292" fill="none" stroke="#39d8cf" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M560 292 C604 292 606 215 650 215" fill="none" stroke="#39d8cf" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M920 215 C958 215 960 180 1000 180" fill="none" stroke="#39d8cf" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M920 215 C960 215 960 322 1000 322" fill="none" stroke="#39d8cf" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1105 230 C1105 408 896 420 896 456" fill="none" stroke="#466b82" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1105 372 C1105 418 592 420 592 456" fill="none" stroke="#466b82" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1000 180 C820 180 287 360 287 456" fill="none" stroke="#466b82" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 610 C640 590 640 582 640 568" fill="none" stroke="#466b82" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
