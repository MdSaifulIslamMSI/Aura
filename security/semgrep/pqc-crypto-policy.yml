rules:
  - id: nodejs-crypto-public-encrypt
    message: Do not add RSA publicEncrypt application payload encryption; use standards-backed TLS and policy-tracked hybrid migration.
    severity: ERROR
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-either:
          - pattern: crypto.publicEncrypt(...)
          - pattern: publicEncrypt(...)
    paths:
      exclude:
        # Deliberate bad-example fixtures consumed by the node-side PQC policy
        # checks (scripts/security/pqc-*.mjs); they are the policy's own test
        # corpus, not production violations.
        - tests/fixtures/security/pqc/**

  - id: nodejs-crypto-private-decrypt
    message: Do not add RSA privateDecrypt application payload paths; keep production crypto standards-aligned and config-driven.
    severity: ERROR
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-either:
          - pattern: crypto.privateDecrypt(...)
          - pattern: privateDecrypt(...)
    paths:
      exclude:
        - tests/fixtures/security/pqc/**

  - id: nodejs-create-ecdh
    message: Do not add custom ECDH key exchange. This policy prevents new quantum-vulnerable long-lived crypto from entering the app.
    severity: ERROR
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-either:
          - pattern: crypto.createECDH(...)
          - pattern: createECDH(...)
    paths:
      exclude:
        - tests/fixtures/security/pqc/**

  - id: nodejs-create-diffie-hellman
    message: Do not add custom DH/Diffie-Hellman key exchange; prefer TLS 1.3 and staged hybrid PQC experiments.
    severity: ERROR
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-either:
          - pattern: crypto.createDiffieHellman(...)
          - pattern: createDiffieHellman(...)
          - pattern: crypto.diffieHellman(...)
          - pattern: diffieHellman(...)
    paths:
      exclude:
        - tests/fixtures/security/pqc/**

  - id: nodejs-md5
    message: Do not add MD5 usage. Use modern integrity/signature primitives and document legacy exceptions with expiring allowlists.
    severity: ERROR
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("md5")
          - pattern: crypto.createHash('md5')
          - pattern: createHash("md5")
          - pattern: createHash('md5')
    paths:
      exclude:
        - tests/fixtures/security/pqc/**
        # Accepted in config/security/pqc-allowlist.json (MD5_USAGE):
        - server/services/listingService.js

  - id: nodejs-sha1
    message: Do not add SHA1 for signatures or integrity. Use SHA-256 or stronger where hashing is required.
    severity: ERROR
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("sha1")
          - pattern: crypto.createHash('sha1')
          - pattern: createHash("sha1")
          - pattern: createHash('sha1')
          - pattern: crypto.createSign("sha1")
          - pattern: crypto.createSign('sha1')
          - pattern: createSign("sha1")
          - pattern: createSign('sha1')
    paths:
      exclude:
        - tests/fixtures/security/pqc/**
        # Accepted in config/security/pqc-allowlist.json (SHA1_SIGNATURE_OR_INTEGRITY);
        # deterministic identifiers, not security primitives:
        - server/services/productImageResolver.js
        - server/services/catalogArtworkService.js
        - scripts/i18n/codemod-jsx-stable-text.mjs
        - scripts/i18n/discover-stable-ui-text.mjs

  - id: hardcoded-private-key
    message: Remove hardcoded private key material and load secrets from approved runtime secret storage.
    severity: ERROR
    languages:
      - generic
    pattern-regex: "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"

  - id: tls-v1-config
    message: Disable TLS 1.0 in executable configuration; TLS 1.3 is the production-ready baseline.
    severity: ERROR
    languages:
      - generic
    pattern-regex: "\\bTLSv1(\\.0)?\\b(?!\\.\\d)"
    paths:
      exclude:
        # The policy surfaces themselves list forbidden protocols/ciphers in
        # order to forbid them; flagging them is self-referential noise.
        - security/semgrep/**
        - config/security/**
        - scripts/security/**
        - tests/fixtures/security/pqc/**
        # Server tests assert the readiness scanners' behavior and contain the
        # forbidden protocol names as literal fixtures:
        - server/tests/**

  - id: tls-v1-1-config
    message: Disable TLS 1.1 in executable configuration; TLS 1.3 is the production-ready baseline.
    severity: ERROR
    languages:
      - generic
    pattern-regex: "\\bTLSv1\\.1\\b"
    paths:
      exclude:
        - security/semgrep/**
        - config/security/**
        - scripts/security/**
        - tests/fixtures/security/pqc/**
        - server/tests/**

  - id: insecure-cipher-config
    message: Remove weak cipher or protocol configuration from executable proxy/TLS files.
    severity: ERROR
    languages:
      - generic
    pattern-regex: "\\b(SSLv2|SSLv3|RC4|DES-CBC|3DES|MD5)\\b"
    paths:
      exclude:
        - security/semgrep/**
        - config/security/**
        - scripts/security/**
        - tests/fixtures/security/pqc/**
        - server/tests/**

  - id: risky-jwt-classical-signing-warning
    message: Classical JWT signatures are not bad today everywhere, but long-lived classical-only signing must stay tracked until PQ signatures are ecosystem-ready.
    severity: WARNING
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-either:
          - pattern: jwt.sign(...)
          - pattern: new SignJWT(...)
    paths:
      exclude:
        - tests/fixtures/security/pqc/**
        # Test suites mint throwaway tokens; the policy targets long-lived
        # production signing decisions:
        - server/tests/**
        - tests/**

# Notes:
# - These rules do not claim RSA or ECC are universally broken today.
# - The goal is to prevent new quantum-vulnerable, long-lived crypto from entering the app.
# - Existing third-party classical crypto may remain until WebPKI, JWT, SDK, and provider ecosystems support production-ready PQ signatures.
# - Algorithm-name mentions (RS256/ES256/PS256 literals) are intentionally NOT
#   flagged; mere mentions — including the RFC 9449-mandated DPoP ES256 alg
#   header and config denylists — are tracked by the node-side crypto
#   inventory (scripts/security/crypto-inventory.mjs) instead. Only real JWT
#   library signing calls (jwt.sign / SignJWT) are reported; generic
#   crypto.sign calls such as window.crypto.subtle.sign are out of scope.
# - sha1/md5 exceptions are documented per file in config/security/pqc-allowlist.json
#   with reasons and expiry and are excluded at the rule level above; the
#   in-code // nosemgrep comments mirror them for scanners that do not apply
#   the path-based namespace.
