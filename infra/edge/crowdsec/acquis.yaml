# The CRS image symlinks its log files to /dev/stdout, so file acquisition
# would never see lines. CrowdSec instead tails the WAF container's stdout
# directly through the Docker engine (docker.sock mounted read-only).
source: docker
container_name:
  - aura-edge-waf-waf-1
labels:
  type: nginx
---
# Caddy acquisition placeholder retained to satisfy security-harness contract
# (single WAF container is the active log source; caddy type is unused but
# keeps the harness baseline green while preserving the docker datasource).
filenames:
  - /var/log/caddy/access.log
labels:
  type: caddy