# Production override: layer on top of docker-compose.yml
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the default (verification) stack:
#  - no mock backend — the WAF proxies to the real API container/host
#  - the WAF listens on ${EDGE_HTTP_PORT} (default 8080) on all interfaces so
#    the host firewall/ALB target group can route production traffic through it
#  - no verify profile services
services:
  waf:
    environment:
      BACKEND: ${WAF_BACKEND:?set WAF_BACKEND to the API origin, e.g. http://aura-api:5000}
    ports:
      - "${EDGE_HTTP_PORT:-8080}:8080"
  aura-api-mock:
    profiles: ["verify"]
