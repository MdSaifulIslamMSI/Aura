# Aura free edge WAF stack (Phase 2 cost-cutoff replacement for AWS WAF).
#
# - waf: OWASP ModSecurity CRS v4 in blocking mode, paranoia level 1, in front
#   of the API backend (WAF_BACKEND, default: the CI mock API).
# - crowdsec: parses the WAF access/audit logs and maintains IP decisions.
# - aura-api-mock: verification-only backend, activated by the `verify`
#   profile. Production runs `docker compose up -d waf crowdsec` with
#   WAF_BACKEND pointing at the real API (e.g. http://aura-api:5000).
#
# Verify locally:  docker compose --profile verify up -d --wait
#                  node ../../scripts/security/edge-waf-verification.mjs
name: aura-edge-waf

services:
  aura-api-mock:
    image: node:24-alpine
    profiles: ["verify"]
    working_dir: /srv
    volumes:
      - ./mock-api.mjs:/srv/mock-api.mjs:ro
    command: node /srv/mock-api.mjs
    environment:
      PORT: "8000"
    networks:
      - aura-edge-internal
    restart: unless-stopped

  waf:
    image: owasp/modsecurity-crs:4.25.1-nginx-lts
    restart: unless-stopped
    # NOTE: no hard depends_on on the verify-profile mock â€” production runs
    # `up -d waf crowdsec` without that profile; readiness is asserted by
    # scripts/security/edge-waf-verification.mjs instead.
    environment:
      SERVER_NAME: aura-waf
      BACKEND: ${WAF_BACKEND:-http://aura-api-mock:8000}
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_LOG: /var/log/waf/audit.log
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      REPORTING_LEVEL: "2"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # ModSec directives must live in /etc/modsecurity.d/, NOT nginx conf.d â€”
      # nginx conf.d expects NGINX directives and will crash on Sec* rules.
      - ./modsecurity-crs/crs-overrides.conf:/etc/modsecurity.d/crs-overrides.conf:ro
      - waf-logs:/var/log/nginx
      - waf-logs:/var/log/waf
    networks:
      - aura-edge-internal

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8-debian
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/nginx"
      BOUNCER_KEY: ""
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-db:/var/lib/crowdsec/data
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # Docker datasource: read-only socket access so CrowdSec can tail the
      # WAF container's stdout logs (see crowdsec/acquis.yaml).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aura-edge-internal

volumes:
  waf-logs:
  crowdsec-config:
  crowdsec-db:

networks:
  aura-edge-internal:
    driver: bridge
