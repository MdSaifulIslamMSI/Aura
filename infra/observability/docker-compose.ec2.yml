# Runs alongside the production api stack (infra/aws/docker-compose.ec2.yml,
# compose project "aws" on the aws_default network). The api/worker containers
# register the "api" DNS alias on aws_default, so scrapes and webhook posts
# resolve without sharing a compose project; the network is joined as external
# because these services are defined in a different file.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.ec2.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - /opt/aura/shared/metrics-secret:/run/secrets/aura_metrics_secret:ro
      - aura-prometheus-data:/prometheus
    networks:
      - aws_default
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    logging: *default-logging
    # The image ships no envsubst; render the token/URL placeholders with sed.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -e "s|__AURA_STATUS_WEBHOOK_URL__|${AURA_STATUS_WEBHOOK_URL:-http://api:5000/api/status/webhooks/alertmanager}|g" \
            -e "s|__ALERTMANAGER_STATUS_WEBHOOK_TOKEN__|${ALERTMANAGER_STATUS_WEBHOOK_TOKEN:?ALERTMANAGER_STATUS_WEBHOOK_TOKEN is required (must match the API's STATUS_WEBHOOK_TOKEN)}|g" \
            /etc/alertmanager/alertmanager.template.yml > /etc/alertmanager/alertmanager.yml
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      AURA_STATUS_WEBHOOK_URL: ${AURA_STATUS_WEBHOOK_URL:-http://api:5000/api/status/webhooks/alertmanager}
      ALERTMANAGER_STATUS_WEBHOOK_TOKEN: ${ALERTMANAGER_STATUS_WEBHOOK_TOKEN:-${STATUS_WEBHOOK_TOKEN:-}}
    volumes:
      - ./alertmanager/alertmanager.template.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - aura-alertmanager-data:/alertmanager
    networks:
      - aws_default

  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aura-grafana-data:/var/lib/grafana
    networks:
      - aws_default
    depends_on:
      - prometheus

volumes:
  aura-prometheus-data:
  aura-grafana-data:
  aura-alertmanager-data:

networks:
  aws_default:
    external: true
