services:
  backend:
    image: ${STAGING_BACKEND_IMAGE:-aura-staging-backend:local}
    build:
      context: ${STAGING_BACKEND_BUILD_CONTEXT:-../..}
      dockerfile: server/Dockerfile
    env_file:
      - .env.staging
    environment:
      PORT: ${STAGING_BACKEND_PORT:-3000}
      BACKEND_PORT: ${STAGING_BACKEND_PORT:-3000}
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
    expose:
      - "${STAGING_BACKEND_PORT:-3000}"
    ports:
      - "127.0.0.1:${STAGING_BACKEND_PORT:-3000}:${STAGING_BACKEND_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health/live').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));\""]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    networks:
      - aura-staging
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: aura_staging
      POSTGRES_USER: aura_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aura-staging
    restart: unless-stopped

  mongo:
    image: mongo:7@sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (error) { try { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) } catch (_) {} }; db.hello().isWritablePrimary ? quit(0) : quit(1)"
      interval: 5s
      timeout: 10s
      start_period: 5s
      retries: 24
    volumes:
      - mongo-data:/data/db
    networks:
      - aura-staging
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - aura-staging
    restart: unless-stopped

  scanner:
    image: clamav/clamav:1.4_base@sha256:41f0d067c0f2e87a7083d4ca202373aeec18dd0a3f8619c1a8c8556d747705e2
    profiles: ["malware-scan"]
    environment:
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 20m
      retries: 3
    expose:
      - "3310"
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - aura-staging
    restart: unless-stopped

networks:
  aura-staging:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  clamav-data:
